syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// UserService provides information about the signed in user, and their
// settings.
service UserService {
  // Get the signed in user. The response has no user when no one is
  // signed in.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // Create an API token. API tokens authenticate MCP clients and other API
  // clients with an "Authorization: Bearer <token>" header.
  rpc CreateAPIToken(CreateAPITokenRequest) returns (CreateAPITokenResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // List the user's API tokens.
  rpc ListAPITokens(ListAPITokensRequest) returns (ListAPITokensResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Delete an API token.
  rpc DeleteAPIToken(DeleteAPITokenRequest) returns (DeleteAPITokenResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Get whether the user has a calendar feed: a secret URL a calendar app
  // subscribes to, for the cooks, prep and meals of the person the user
  // is. Its URL is only returned by CreateCalendarFeed.
  rpc GetCalendarFeed(GetCalendarFeedRequest) returns (GetCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Create the user's calendar feed, returning its URL. An old feed is
  // replaced, and its URL stops working.
  rpc CreateCalendarFeed(CreateCalendarFeedRequest) returns (CreateCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Delete the user's calendar feed, so its URL stops working.
  rpc DeleteCalendarFeed(DeleteCalendarFeedRequest) returns (DeleteCalendarFeedResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Upload a picture to use as the user's avatar, replacing any previous
  // one. The middle square of the picture is used.
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Remove the user's avatar.
  rpc DeleteAvatar(DeleteAvatarRequest) returns (DeleteAvatarResponse) {
    option (mcp.v1.method).exclude = true;
  }
  // Change the signed in user's settings, like the units they read amounts
  // in.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Get the signed in user's household: the people who share recipes,
  // plans, the pantry and the shopping list.
  rpc GetHousehold(GetHouseholdRequest) returns (GetHouseholdResponse);
  // Rename the signed in user's household.
  rpc UpdateHousehold(UpdateHouseholdRequest) returns (UpdateHouseholdResponse) {
    option (mcp.v1.method).exclude = true;
  }
}

// A household: the users who share everything the app stores about food,
// like recipes, plans, the pantry and the shopping list.
message Household {
  // The ID of the household.
  string id = 1 [(mcp.v1.field).output_only = true];
  // A name for the household, e.g. "Home". From 1 to 100 characters.
  string name = 2;
  // The users in the household, the first to join first.
  repeated HouseholdMember members = 3 [(mcp.v1.field).output_only = true];
}

// A user in a household.
message HouseholdMember {
  // The ID of the user.
  string user_id = 1;
  // The user's name.
  string name = 2;
  // The URL of the user's avatar image, relative to the site. Empty if the
  // user has no avatar.
  string avatar_url = 3;
}

message GetHouseholdRequest {}

message GetHouseholdResponse {
  Household household = 1;
}

message UpdateHouseholdRequest {
  // The new name of the household, from 1 to 100 characters.
  string name = 1;
}

message UpdateHouseholdResponse {
  Household household = 1;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string given_name = 4;
  string family_name = 5;
  // The URL of the user's avatar image, relative to the site. Empty if the
  // user has no avatar.
  string avatar_url = 6;
  // Whether the user is an administrator, who can invite new users into
  // their household.
  bool admin = 7;
  // The ID of the user's household.
  string household_id = 8;
  // The units the user reads amounts in. Amounts are stored and given in
  // metric units either way; it's how apps show them.
  UnitSystem unit_system = 9;
}

// UnitSystem is the units a user reads amounts in.
enum UnitSystem {
  // Metric.
  UNIT_SYSTEM_UNSPECIFIED = 0;
  // Grams, kilograms and milliliters, with teaspoons and tablespoons for
  // small volumes.
  UNIT_SYSTEM_METRIC = 1;
  // US customary units: ounces, pounds, cups, teaspoons and tablespoons.
  UNIT_SYSTEM_IMPERIAL = 2;
}

message UpdateSettingsRequest {
  // The units to read amounts in. Required.
  UnitSystem unit_system = 1;
}

message UpdateSettingsResponse {
  // The user, with the new settings.
  User user = 1;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  // The signed in user, unset when no one is signed in.
  User user = 1;
}

// An API token. The token secret is only returned when it is created.
message APIToken {
  // The ID of the token.
  string id = 1;
  // A name describing what the token is used for.
  string name = 2;
  // When the token was created.
  google.protobuf.Timestamp create_time = 3;
  // When the token was last used, if ever.
  google.protobuf.Timestamp last_used_time = 4;
}

message CreateAPITokenRequest {
  // A name describing what the token is used for.
  string name = 1;
}

message CreateAPITokenResponse {
  // The created token.
  APIToken token = 1;
  // The token secret. It is not stored and cannot be retrieved again.
  string secret = 2;
}

message ListAPITokensRequest {}

message ListAPITokensResponse {
  // The user's tokens.
  repeated APIToken tokens = 1;
}

message DeleteAPITokenRequest {
  // The ID of the token to delete.
  string id = 1;
}

message DeleteAPITokenResponse {}

// A user's calendar feed.
message CalendarFeed {
  // When it was created.
  google.protobuf.Timestamp create_time = 1;
  // When a calendar app last read it, unset if none has.
  google.protobuf.Timestamp last_used_time = 2;
  // The URL to subscribe to, only set when it's created: only a hash of
  // its secret is kept.
  string url = 3;
}

message GetCalendarFeedRequest {}

message GetCalendarFeedResponse {
  // The feed, unset if the user has none.
  CalendarFeed feed = 1;
}

message CreateCalendarFeedRequest {}

message CreateCalendarFeedResponse {
  // The feed, with its URL.
  CalendarFeed feed = 1;
}

message DeleteCalendarFeedRequest {}

message DeleteCalendarFeedResponse {}

message UploadAvatarRequest {
  // The picture, a JPEG, PNG or WebP image.
  bytes data = 1;
}

message UploadAvatarResponse {
  // The user, with the new avatar.
  User user = 1;
}

message DeleteAvatarRequest {}

message DeleteAvatarResponse {
  // The user, without an avatar.
  User user = 1;
}
