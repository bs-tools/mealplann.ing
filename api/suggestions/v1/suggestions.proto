syntax = "proto3";

package suggestions.v1;

import "foods/v1/foods.proto";
import "people/v1/people.proto";
import "plans/v1/plans.proto";

// SuggestionService suggests which of the household's recipes (see
// RecipeService) to cook for an open slot of the plan (see PlanService):
// a shared meal on a date, or one person's eating time, like a small meal.
// It scores every recipe against the rest of the week, explaining each
// score, so the household shops once a week, wastes little, and meets
// everyone's rules and targets.
//
// To plan a week with it:
//
// 1. Read the week with PlanService.GetWeek, and find the open slots: the
//    shared meals with nothing planned, and eating times left empty.
// 2. Call SuggestRecipes for a slot. Plan the fullest days and the meals
//    that share fresh ingredients first, as each suggestion counts what's
//    already planned.
// 3. Read the components of the top suggestions, not just the score: a
//    suggestion with fits_rules false breaks someone's rules, saying how in
//    warnings, and is only worth planning if the user accepts that or it's
//    paired with something that fixes it.
// 4. Plan the chosen recipe: with PlanService.PlanMeal for a shared meal,
//    or for an eating time with PlanService.CreateCook of cook_servings and
//    PlanService.CreatePortion of the suggested portion. A suggestion with
//    leftover_of is the rest of an earlier meal: plan it with
//    PlanService.PlanMeals, giving its leftover_of. Then call
//    SuggestRecipes for the next slot, as the scores change with the plan.
// 5. When the week is planned, make the shopping list with
//    ShoppingService.CreateShoppingList.
//
// The scores are a guide, not a rule: reason beyond them with what the
// user says they like or have time for. If no recipe scores well, propose
// a new one that would, e.g. one using the pantry's foods close to their
// use-by date, the rest of a pack, or more of a nutrient someone is short
// of, and create it with RecipeService.CreateRecipe once the user agrees.
// Never change a person's rules or targets to make a suggestion fit: they
// come from the person's care team.
service SuggestionService {
  // Score the household's recipes for an open slot of the plan, and return
  // the best, best first. Each suggestion has its total score and the
  // components it's made of, each with points and a reason, of these
  // kinds:
  //
  // - SHARED_INGREDIENTS: it uses ingredients other cooks of the week buy,
  //   especially fresh ones, and how many new items it adds to the shop.
  // - PACK_LEFTOVERS: it uses what's left of packs the week's plan buys,
  //   like the other half of a can.
  // - PANTRY: it uses what's in the pantry, more so for lots close to their
  //   use-by date. Foods always in stock don't count.
  // - NUTRITION: it fills the eaters' daily minimums, or pushes them over
  //   their daily maximums, given the rest of the day's plan.
  // - RULES: its portions break, or meet, the eaters' rules for each eating
  //   time, like the minimum protein or the carbohydrate pairing.
  // - KEEPING: what it needs bought keeps from the shop until the date, and
  //   its leftovers keep until they're eaten.
  // - VARIETY: it's already planned on nearby days, or is an eater's
  //   staple that day.
  // - MEAL_TAG: its tags say it's for this meal, or for another. At one
  //   person's small meal, recipes tagged "snack" come first, and others
  //   have a penalty.
  // - LEFTOVER: at one person's small meal, it's a serving more of an
  //   earlier shared meal's cook (see leftover_of), eaten reheated, with no
  //   cooking: the latest cook of each recipe, from an earlier day within
  //   its fridge_days (2 if unknown), or earlier the same day.
  // - FAVORITE: the household marked it as a favorite (see
  //   RecipeService). It's worth about as much as using the rest of a
  //   pack, so favorites come up more often, but less than having cooked
  //   it in the last few days or breaking someone's rule.
  // - COOKED: the household cooked it, marking the cook done, in the last
  //   90 days, a point a time, up to 3, as what's cooked again is liked.
  //
  // Recipes the household doesn't want suggested, or snoozed until after
  // the slot's date (see Recipe.not_suggested and Recipe.snoozed_until),
  // aren't suggested, like drafts.
  //
  // Portions are split like PlanMeal does, within each person's
  // max_portion_grams. Nothing is changed. Fails with INVALID_ARGUMENT for
  // a bad date or an eating time that isn't the person's, and with
  // FAILED_PRECONDITION if nobody eats from the shared meal.
  rpc SuggestRecipes(SuggestRecipesRequest) returns (SuggestRecipesResponse);
  // Suggest a whole plan for the household for the next days at once: a
  // recipe for each open breakfast, lunch or dinner, and for each eating
  // time of one person that eats from no shared meal, like a snack
  // mid-morning, chosen together so the days share ingredients and packs,
  // use the pantry, vary, and meet everyone's rules and targets. Breakfast
  // only gets recipes tagged "breakfast"; lunch and dinner take any recipe,
  // a breakfast for lunch too, preferring those tagged for them. One
  // person's small meal takes a recipe tagged "snack" that breaks no rule,
  // if there's any, even if it repeats; otherwise the rest of an earlier
  // meal of the plan, reheated (see Suggestion.leftover_of), or another
  // recipe. Its alternatives include the leftovers. A slot left without
  // one says why. It's the fastest way to plan a week:
  //
  // 1. Call SuggestPlan with the first date, the number of days and the
  //    meals, and criteria from what the user wants, like more variety,
  //    their favorites, or quick recipes only.
  // 2. Show the user the plan. Each slot has its suggestion, with the
  //    reasons, and alternatives.
  // 3. To change it, call SuggestPlan again with choices: the slots to
  //    keep, with their recipe (e.g. an alternative the user picked), and
  //    those to leave empty. The other slots are planned again around
  //    them, with a new seed for something different, or the same seed
  //    for the same plan.
  // 4. Save it with PlanService.PlanMeals, with the recipe of each slot,
  //    and its suggestion's leftover_of.
  //
  // The search is probabilistic: it tries many plans for about two
  // seconds, picking each slot's recipe among the best for it given the
  // slots planned before, keeps the best plan, and then improves each slot
  // given all the others. Slots that already have a cook of their meal
  // aren't planned again, nor are eating times with portions or staples. A
  // shared meal leaves out the people with a staple that replaces it that
  // day (see Staple.replaces_meal), who eat that instead, and is planned
  // already if everyone has one.
  // An eating time where the rest of a shared meal of the plan is eaten,
  // as it's more than the person's max_portion_grams, isn't planned
  // either. A slot only gets a recipe that breaks someone's rules if every
  // recipe does. Nothing is changed. Fails with
  // INVALID_ARGUMENT for bad dates or criteria, and FAILED_PRECONDITION if
  // nobody eats from the meals, or no recipe meets the criteria.
  rpc SuggestPlan(SuggestPlanRequest) returns (SuggestPlanResponse);
  // Suggest changes to a person's planned day, or one of its eating times,
  // that fix its warnings (see PlanService.GetWeek), or bring it closer
  // to the rules and targets: leaving a portion out, resizing it,
  // replacing it with one of the household's recipes, or adding a recipe
  // or a food in the pantry, like "Replace Wraps with Side salad" for a
  // day over its energy maximum. Each change is tried against the same
  // rules and targets GetWeek checks, and the best ones are returned, the
  // fewest warnings left first, with the warnings they fix and leave.
  // Apply one with PlanService: DeletePortion, UpdatePortion, or
  // CreatePortion, with new_cook for a recipe. Shares of shared cooks
  // that are resized or removed leave servings over, to plan elsewhere or
  // take off the cook. Staples aren't changed: skip them with SkipStaple.
  // Nothing is changed. Returns no fixes if nothing helps.
  rpc SuggestFixes(SuggestFixesRequest) returns (SuggestFixesResponse);
}

// An eating time of one person, to suggest a recipe for, like a small
// meal.
message EatingTimeSlot {
  // The ID of the person. Required.
  string person_id = 1;
  // The ID of one of the person's eating times. Required.
  string eating_time_id = 2;
}

message SuggestRecipesRequest {
  // The date of the slot (YYYY-MM-DD). Required.
  string date = 1;
  // The slot to suggest for. Required.
  oneof slot {
    // A shared meal, eaten by everyone whose eating pattern eats from it,
    // like PlanMeal.
    people.v1.HouseholdMeal meal = 2;
    // One person's eating time, e.g. a small meal between main meals.
    EatingTimeSlot eating_time = 3;
  }
  // For a shared meal, the people who eat it, each of whom must have an
  // eating time for it. Empty for everyone who does and has no staple that
  // replaces it that day. Ignored for an eating time.
  repeated string person_ids = 4;
  // How many suggestions to return, from 1 to 50. 0 for 8.
  int32 max_suggestions = 5;
}

message SuggestRecipesResponse {
  // The suggestions, highest score first.
  repeated Suggestion suggestions = 1;
  // The date of the shop the slot's fresh foods are bought on
  // (YYYY-MM-DD): the start date of the latest shopping list not yet
  // complete whose dates include the slot's, or else today (UTC), or the
  // slot's date if that's earlier. KEEPING counts from it.
  string shop_date = 2;
  // How many recipes were scored: all of the household's.
  int32 recipe_count = 3;
}

// ScoreKind is what a component of a suggestion's score is about.
enum ScoreKind {
  SCORE_KIND_UNSPECIFIED = 0;
  // Ingredients shared with the week's other cooks, and the new items it
  // adds to the shop.
  SCORE_KIND_SHARED_INGREDIENTS = 1;
  // The rest of packs the week's plan already buys.
  SCORE_KIND_PACK_LEFTOVERS = 2;
  // Foods in the pantry, especially those to use soon.
  SCORE_KIND_PANTRY = 3;
  // The eaters' daily nutrient targets.
  SCORE_KIND_NUTRITION = 4;
  // The eaters' rules for each eating time.
  SCORE_KIND_RULES = 5;
  // Whether what it needs keeps from the shop, and its leftovers until
  // they're eaten.
  SCORE_KIND_KEEPING = 6;
  // The same recipe planned on nearby days, or as a staple.
  SCORE_KIND_VARIETY = 8;
  // The recipe's tags for meals.
  SCORE_KIND_MEAL_TAG = 9;
  // The household's favorite recipes.
  SCORE_KIND_FAVORITE = 10;
  // The rest of an earlier shared meal, reheated at a small meal.
  SCORE_KIND_LEFTOVER = 11;
  // How often the household cooked it lately.
  SCORE_KIND_COOKED = 12;
  reserved 7;
  reserved "SCORE_KIND_FLAVOR";
}

// A part of a suggestion's score.
message ScoreComponent {
  // What it's about.
  ScoreKind kind = 1;
  // The points it adds, negative for a penalty.
  double points = 2;
  // Why, for the user, e.g. "uses the other 200 g of the 400 g pack of
  // coconut milk bought for Tuesday's Thai curry".
  string reason = 3;
}

// A portion a suggestion would plan, split like PlanMeal splits a shared
// meal.
message SuggestedPortion {
  // The ID of the person.
  string person_id = 1;
  // The name of the person.
  string person_name = 2;
  // The ID of the eating time.
  string eating_time_id = 3;
  // The name of the eating time.
  string eating_time_name = 4;
  // The date it's eaten (YYYY-MM-DD), later than the slot's for a part
  // moved to the next day's small meals.
  string date = 5;
  // The servings of the recipe.
  double servings = 6;
  // The weight, in grams, 0 if the recipe can't be weighed.
  double grams = 7;
}

// A food a suggestion needs bought, beyond the week's shopping.
message ItemToBuy {
  // The ID of the food.
  string food_id = 1;
  // The name of the food.
  string food_name = 2;
  // How much more to buy, e.g. "1 × 400 g" or "150 g".
  string amount_text = 3;
  // Whether the week's plan already buys some of the food, so it's more of
  // an item on the list rather than a new one.
  bool already_listed = 4;
}

// A recipe suggested for the slot, with why.
message Suggestion {
  // The ID of the recipe.
  string recipe_id = 1;
  // The name of the recipe.
  string recipe_name = 2;
  // The total score: the sum of the components' points. Only comparable
  // between suggestions for the same slot.
  double score = 3;
  // The components of the score, largest first.
  repeated ScoreComponent components = 4;
  // Whether its portions keep within every eater's rules for their eating
  // times. If false, warnings say which rules break; it can still be
  // planned if the user chooses.
  bool fits_rules = 5;
  // The rules its portions would break, like GetWeek's warnings, with the
  // person's name in the message.
  repeated plans.v1.Warning warnings = 6;
  // The portions it would plan, by person and date.
  repeated SuggestedPortion portions = 7;
  // The servings to cook: those PlanMeal would cook for a shared meal, or
  // the portion's for an eating time, at least 0.25.
  double cook_servings = 8;
  // How many of items_to_buy aren't on the week's shopping already.
  int32 new_item_count = 9;
  // What it needs bought beyond the pantry and the week's shopping,
  // rounded to whole packs, by name.
  repeated ItemToBuy items_to_buy = 10;
  // At one person's small meal, the earlier shared meal it's the rest of,
  // eaten reheated: a serving more of that meal's cook of the recipe,
  // rather than a new cook, with cook_servings the servings it adds. Unset
  // for a new cook.
  plans.v1.LeftoverOf leftover_of = 11;
}

// Emphasis is how much a criterion of a plan counts.
enum Emphasis {
  // Normal.
  EMPHASIS_UNSPECIFIED = 0;
  // Not at all: its score components are left out.
  EMPHASIS_OFF = 1;
  // Half as much as normal.
  EMPHASIS_LOW = 2;
  // As SuggestRecipes counts it.
  EMPHASIS_NORMAL = 3;
  // Twice as much as normal.
  EMPHASIS_HIGH = 4;
}

// What the user wants of a suggested plan. Someone's rules always count
// fully, as they come from their care team.
message PlanCriteria {
  // How much to avoid repeating recipes on nearby days (VARIETY).
  Emphasis variety = 1;
  // How much to prefer the household's favorites (FAVORITE).
  Emphasis favorites = 2;
  // How much to use up the pantry and the rest of packs (PANTRY and
  // PACK_LEFTOVERS).
  Emphasis pantry = 3;
  // How much to keep the shop short, with ingredients shared between
  // meals and fresh food that keeps until it's cooked
  // (SHARED_INGREDIENTS and KEEPING).
  Emphasis shopping = 4;
  // How much to meet everyone's daily nutrient targets (NUTRITION).
  Emphasis nutrition = 5;
  // Only plan recipes whose preparation and cooking take at most this
  // long in all, in seconds. 0 for any time. Recipes of unknown times
  // count as quick enough.
  int32 max_total_seconds = 6;
  // Don't plan recipes with any of these tags, e.g. "slow-cooker".
  repeated string exclude_tags = 7;
  // Don't plan these recipes, e.g. ones the user doesn't want this week.
  repeated string exclude_recipe_ids = 8;
}

// The user's choice for a slot of a suggested plan.
message PlanChoice {
  // The date of the slot (YYYY-MM-DD). Required.
  string date = 1;
  // The shared meal of the slot. Required, unless eating_time_id is set.
  people.v1.HouseholdMeal meal = 2;
  // The ID of the recipe to keep at the slot, whatever the criteria, or
  // empty to leave the slot empty.
  string recipe_id = 3;
  // Instead of a shared meal, the person of a slot of one person's eating
  // time, with eating_time_id.
  string person_id = 4;
  // The person's eating time, with person_id.
  string eating_time_id = 5;
  // For one person's eating time, to keep the rest of an earlier shared
  // meal of recipe_id there rather than a new cook, as a suggestion's
  // leftover_of says. It's kept if the plan has that meal's cook of the
  // recipe.
  plans.v1.LeftoverOf leftover_of = 6;
}

message SuggestPlanRequest {
  // The first date to plan (YYYY-MM-DD). Required.
  string start_date = 1;
  // How many days to plan, from 1 to 14.
  int32 days = 2;
  // The shared meals to plan each day. Empty for every meal someone eats
  // from.
  repeated people.v1.HouseholdMeal meals = 3;
  // What the user wants of the plan.
  PlanCriteria criteria = 4;
  // The slots the user chose a recipe for, or to leave empty. At most one
  // per slot.
  repeated PlanChoice choices = 5;
  // The seed of the search's random draws: the same request with the same
  // seed suggests the same plan, if the household's data hasn't changed.
  // 0 for a new one, which the response returns.
  uint64 seed = 6;
  // Whether to leave out the eating times of one person, like snacks, and
  // plan only the shared meals.
  bool skip_personal_eating_times = 7;
}

// PlanSlotState is what a slot of a suggested plan holds.
enum PlanSlotState {
  PLAN_SLOT_STATE_UNSPECIFIED = 0;
  // A suggested recipe.
  PLAN_SLOT_STATE_SUGGESTED = 1;
  // The recipe the user chose to keep.
  PLAN_SLOT_STATE_KEPT = 2;
  // Nothing, as the user chose to leave it empty.
  PLAN_SLOT_STATE_SKIPPED = 3;
  // Nothing new, as it's planned already: see planned_recipe_names.
  PLAN_SLOT_STATE_PLANNED = 4;
  // Nothing, as no recipe could be suggested: see unfilled_reason.
  PLAN_SLOT_STATE_UNFILLED = 5;
  // Nothing new, for one person's eating time: they eat the rest of a
  // shared meal of the plan there, as it's more than their
  // max_portion_grams.
  PLAN_SLOT_STATE_FILLED_BY_MEAL = 6;
  // Nothing, as everyone eats out there (see PlanService.SetEatingOut).
  PLAN_SLOT_STATE_EATING_OUT = 7;
}

// A slot of a suggested plan: a shared meal on a date, or one person's
// eating time that eats from no shared meal, like a snack.
message PlanSlot {
  // The date (YYYY-MM-DD).
  string date = 1;
  // The shared meal, HOUSEHOLD_MEAL_UNSPECIFIED for one person's eating
  // time.
  people.v1.HouseholdMeal meal = 2;
  // What it holds.
  PlanSlotState state = 3;
  // The recipe suggested or kept, scored against the rest of the plan,
  // for SUGGESTED and KEPT.
  Suggestion suggestion = 4;
  // The next best recipes for the slot, given the rest of the plan, best
  // first, for SUGGESTED and KEPT.
  repeated Suggestion alternatives = 5;
  // The recipes of the cooks already planned at the slot, for PLANNED.
  repeated string planned_recipe_names = 6;
  // How many of the recipes meeting the criteria break nobody's rules at
  // the slot, given the rest of the plan, for SUGGESTED and KEPT. If it's
  // fewer than the days planned, the plan repeats them, or breaks a rule:
  // suggest adding recipes that fit, or checking that the rules are the
  // care team's.
  int32 fitting_recipe_count = 7;
  // The person, for one person's eating time.
  string person_id = 8;
  // The person's name, for one person's eating time.
  string person_name = 9;
  // The eating time, for one person's eating time.
  string eating_time_id = 10;
  // The eating time's name, e.g. "Mid-morning snack", for one person's
  // eating time.
  string eating_time_name = 11;
  // Why no recipe could be suggested, for UNFILLED, e.g. that no recipe
  // meeting the criteria is tagged "breakfast".
  string unfilled_reason = 12;
}

message SuggestPlanResponse {
  // Every slot of the days, by date, each day's in the order they're
  // eaten: one person's eating time where it is in their day, like a
  // snack between breakfast and lunch, and a shared meal where its eaters
  // eat it.
  repeated PlanSlot slots = 1;
  // The plan's score: the sum of its slots'.
  double score = 2;
  // How many plans the search tried.
  int32 plans_tried = 3;
  // The seed of the search, to suggest the same plan again.
  uint64 seed = 4;
  // How many recipes meet the criteria.
  int32 recipe_count = 5;
}

message SuggestFixesRequest {
  // The ID of the person. Required.
  string person_id = 1;
  // The date (YYYY-MM-DD). Required.
  string date = 2;
  // The eating time to change, empty for any of the day's: the day's
  // targets count either way.
  string eating_time_id = 3;
}

message SuggestFixesResponse {
  // The changes, best first: those leaving the fewest warnings, then
  // closest to the rules and targets, then the smallest.
  repeated PlanFix fixes = 1;
  // The warnings of the eating time, or of the day's eating times, and the
  // day's targets, as planned.
  repeated plans.v1.Warning warnings = 2;
}

// What a fix changes.
enum PlanFixKind {
  PLAN_FIX_KIND_UNSPECIFIED = 0;
  // Leave portion_id out: delete it with PlanService.DeletePortion.
  PLAN_FIX_KIND_REMOVE = 1;
  // Change portion_id's servings, of a share of a cook, or amount and
  // unit, of a food, with PlanService.UpdatePortion.
  PLAN_FIX_KIND_RESIZE = 2;
  // Replace portion_id with servings of recipe_id, or an amount of
  // food_id: delete it, and create the new portion at its eating time,
  // with new_cook for a recipe.
  PLAN_FIX_KIND_REPLACE = 3;
  // Add servings of recipe_id, with new_cook, or an amount of food_id, at
  // eating_time_id, with PlanService.CreatePortion.
  PLAN_FIX_KIND_ADD = 4;
}

// A change to a person's planned day.
message PlanFix {
  // What to change.
  PlanFixKind kind = 1;
  // What it does, for people, e.g. "Replace Wraps with Side salad (1
  // serving)".
  string description = 2;
  // The portion it removes, resizes or replaces.
  string portion_id = 3;
  // The eating time it changes or adds to.
  string eating_time_id = 4;
  // The recipe to replace the portion with, or to add.
  string recipe_id = 5;
  // The food to replace the portion with, or to add.
  string food_id = 6;
  // The new servings, of a share of a cook or recipe_id.
  double servings = 7;
  // The new amount, of a food portion or food_id, in unit.
  double amount = 8;
  foods.v1.AmountUnit unit = 9;
  // The warnings it fixes, by message, as planned.
  repeated string fixed_warnings = 10;
  // The warnings left after it.
  repeated plans.v1.Warning warnings = 11;
  // The day's energy after it, in kcal, and as planned.
  double energy_kcal = 12;
  double planned_energy_kcal = 13;
  // The cook to delete with PlanService.DeleteCook after removing or
  // replacing portion_id, as the portion is all that's planned of it, and
  // it isn't cooked yet: else its servings are left over.
  string delete_cook_id = 14;
}
