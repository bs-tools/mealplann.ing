syntax = "proto3";

package pantry.v1;

import "foods/v1/foods.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// PantryService tracks the household's pantry: how much of each food (see
// FoodService) it has in stock, in grams, with when it expires. A food can
// have several lots, like an opened bag and a new one, each with its own
// expiry date, so the oldest is used first.
//
// The pantry changes by itself in two ways:
//
// 1. Completing a shopping list (see ShoppingService.CompleteShopping) adds
//    the checked items, expiring after the food's shelf_life_days.
// 2. Marking a cook done (see PlanService.UpdateCook) takes its
//    ingredients out, from the lots that expire first, and un-marking it
//    puts them back. Portions of foods and staples aren't taken out, as
//    they're eaten too irregularly to track: correct the pantry with
//    UpdatePantryItem when it's off.
//
// Foods the household always has, like salt and spices, aren't tracked: set
// always_in_stock on the food with FoodService.UpdateFood instead of adding
// them. Check the pantry before generating a shopping list, so the list
// only has what's missing, and ask the user about stock that looks wrong.
//
// Cooked food in stock, like frozen leftovers or a batch of cooked rice, is
// a cook of its recipe (see PlanService.CreateCook's from_stock), not a
// lot, so it keeps its recipe's nutrition and can be planned.
service PantryService {
  // List the household's pantry: every lot in stock, with its food's name
  // and store section, and how many days it has left, ordered by food
  // name and then by expiry, soonest first. Also the foods always in
  // stock. It can list only some foods, a part of the store, or what to use
  // soon, and leave out the times with summary.
  rpc ListPantry(ListPantryRequest) returns (ListPantryResponse);
  // Add an amount of a food to the pantry, as a new lot. The amount is
  // converted to grams with the food's grams_per_piece or
  // grams_per_milliliter, and fails with FAILED_PRECONDITION if the food
  // lacks it: set it with FoodService.UpdateFood, or give the amount in
  // grams. Also fails with FAILED_PRECONDITION if the food is always in
  // stock, as those aren't tracked, unless track_stock is set. The response
  // says how the amount was converted, e.g. "148 ml at 1.17 g/ml is 173 g".
  rpc AddToPantry(AddToPantryRequest) returns (AddToPantryResponse);
  // Add several lots at once, like a shelf from a photo or a shop's
  // receipt. Each lot is added on its own, like AddToPantry, in parallel: the response
  // has a result per request, in order, with what was added or the error.
  // At most 100 requests.
  rpc AddLotsToPantry(AddLotsToPantryRequest) returns (AddLotsToPantryResponse);
  // Update a lot of the pantry, e.g. its grams after using some, or its
  // opened_date when opening it.
  rpc UpdatePantryItem(UpdatePantryItemRequest) returns (UpdatePantryItemResponse);
  // Remove a lot from the pantry, e.g. when it's used up or thrown away.
  rpc RemoveFromPantry(RemoveFromPantryRequest) returns (RemoveFromPantryResponse);
}

// A lot of a food in stock.
message PantryItem {
  // The ID of the lot. Required to update it, and ignored when adding it.
  string id = 1;
  // The ID of the household's food.
  string food_id = 2 [(mcp.v1.field).output_only = true];
  // The name of the food.
  string food_name = 3 [(mcp.v1.field).output_only = true];
  // The part of the store the food is found in.
  foods.v1.StoreSection store_section = 4 [(mcp.v1.field).output_only = true];
  // The amount in stock, in grams. More than 0 and at most 100000.
  double grams = 5;
  // The food's weight per piece, to show the amount in pieces, 0 if
  // unknown.
  double grams_per_piece = 6 [(mcp.v1.field).output_only = true];
  // The date it expires unopened (YYYY-MM-DD), from its pack. Empty if it
  // doesn't or isn't known.
  string expiry_date = 7;
  // The date it was opened (YYYY-MM-DD), empty if it's unopened or the day
  // isn't known (see opened). Once opened, it keeps for the food's
  // opened_shelf_life_days.
  string opened_date = 8;
  // The date to use it by (YYYY-MM-DD). In the freezer, frozen_date plus
  // the food's freezer_shelf_life_days, if known. Otherwise the earlier of
  // expiry_date and the end of its opened shelf life. Empty if none is
  // known.
  string use_by_date = 9 [(mcp.v1.field).output_only = true];
  // The days from today (UTC) to use_by_date: 0 for today, negative once
  // it's past. Unset if use_by_date is empty.
  optional int32 days_to_expiry = 10 [(mcp.v1.field).output_only = true];
  // Notes, e.g. "in the freezer". At most 500 characters.
  string notes = 11;
  // When the lot was added.
  google.protobuf.Timestamp create_time = 12 [(mcp.v1.field).output_only = true];
  // When the lot was last changed.
  google.protobuf.Timestamp update_time = 13 [(mcp.v1.field).output_only = true];
  // Where it's kept, which sets how long it keeps: STORAGE_FREEZER keeps
  // it for the food's freezer_shelf_life_days from frozen_date.
  // STORAGE_UNSPECIFIED if not said, which keeps like the pantry or fridge.
  Storage storage = 14;
  // Where in the home it is, e.g. "chest freezer" or "garage shelf", to
  // find it and tell lots apart. At most 100 characters.
  string location = 15;
  // The date it was frozen (YYYY-MM-DD), for a lot in the freezer. Moving
  // a lot into the freezer sets it to today unless it's given; moving it
  // out clears it.
  string frozen_date = 16;
  // Whether it's been opened, even if the day isn't known: then its use-by
  // date can't count the opened shelf life, and is only its expiry_date.
  // Setting opened_date sets it.
  bool opened = 17;
  // Whether the amount is a guess, like a partly used bag seen in a photo,
  // for the user to check. Clear it once they confirm the amount.
  bool estimated = 18;
  // The brand or label of the lot, e.g. "Sriracha" for one of several hot
  // sauces sharing a food. At most 100 characters.
  string label = 19;
}

// Where a lot is kept.
enum Storage {
  STORAGE_UNSPECIFIED = 0;
  // A cupboard or shelf at room temperature.
  STORAGE_PANTRY = 1;
  // The fridge.
  STORAGE_FRIDGE = 2;
  // The freezer, which keeps food for its freezer_shelf_life_days.
  STORAGE_FREEZER = 3;
}

// A food the household always has, which the pantry doesn't track.
message AlwaysInStockFood {
  // The ID of the food.
  string food_id = 1;
  // The name of the food.
  string food_name = 2;
  // The part of the store the food is found in.
  foods.v1.StoreSection store_section = 3;
}

message ListPantryRequest {
  // Only list lots of these foods. Empty to list all. At most 100.
  repeated string food_ids = 1;
  // Only list lots of foods in this part of the store.
  // STORE_SECTION_UNSPECIFIED to list all.
  foods.v1.StoreSection store_section = 2;
  // Only list lots to use within this many days from today (UTC),
  // including those already past their use-by date. Unset to list all.
  optional int32 expiring_within_days = 3;
  // Whether to leave out the lots' create and update times, to keep a
  // large pantry's response small.
  bool summary = 4;
  // Only list lots kept there. STORAGE_UNSPECIFIED to list all.
  Storage storage = 5;
  // Only list lots whose amounts are guesses, for the user to check.
  bool estimated_only = 6;
}

message ListPantryResponse {
  // The lots in stock, ordered by food name and then use_by_date, soonest
  // first, lots without one last.
  repeated PantryItem items = 1;
  // The foods always in stock, by name.
  repeated AlwaysInStockFood always_in_stock_foods = 2;
}

message AddToPantryRequest {
  // The ID of the household's food. Required.
  string food_id = 1;
  // The amount, in unit. More than 0, unless packages is set.
  double amount = 2;
  // The unit of the amount. Required with amount. Milliliters and pieces
  // are converted to grams with the food's grams_per_milliliter and
  // grams_per_piece.
  foods.v1.AmountUnit unit = 3;
  // The date it expires unopened (YYYY-MM-DD). Empty for today (UTC) plus
  // the food's shelf_life_days, or no expiry date if that's unknown or
  // it's going in the freezer.
  string expiry_date = 4;
  // The date it was opened (YYYY-MM-DD), empty if it's unopened or the day
  // isn't known (see opened).
  string opened_date = 5;
  // Notes. At most 500 characters.
  string notes = 6;
  // Whether to start tracking the food in the pantry if it's always in
  // stock (see FoodService's Food.always_in_stock), clearing that on the
  // food, instead of failing. Set it when the user says how much they have
  // of a food they had marked as always in stock.
  bool track_stock = 7;
  // An ID the caller chooses for this request, like a UUID, to retry it
  // safely: a retry with the same request_id within a day returns the
  // first response instead of creating again. Empty to not deduplicate. At
  // most 100 characters.
  string request_id = 8;
  // Instead of amount and unit, how many of the food's packages (its
  // package_grams), e.g. 0.33 for a third of a jug, or 2.5 for two full
  // bags and a half-full one. Fails with FAILED_PRECONDITION if the food
  // has no package_grams.
  double packages = 9;
  // Where it's kept (see PantryItem.storage).
  Storage storage = 10;
  // Where in the home it is (see PantryItem.location).
  string location = 11;
  // The date it was frozen (YYYY-MM-DD), for STORAGE_FREEZER. Empty for
  // today.
  string frozen_date = 12;
  // Whether it's been opened, on a day that isn't known (see
  // PantryItem.opened). Don't set opened_date to today for a lot opened on
  // an unknown day: that shortens its use-by date.
  bool opened = 13;
  // Whether the amount is a guess (see PantryItem.estimated).
  bool estimated = 14;
  // The brand or label of the lot (see PantryItem.label).
  string label = 15;
}

message AddLotsToPantryRequest {
  // The lots to add, each as AddToPantry takes it, without a request_id.
  // At most 100.
  repeated AddToPantryRequest requests = 1;
  // An ID the caller chooses for this request, like a UUID, to retry it
  // safely: a retry with the same request_id within a day returns the
  // first response instead of creating again. Empty to not deduplicate. At
  // most 100 characters.
  string request_id = 2;
}

message AddLotsToPantryResponse {
  // A result per request, in order.
  repeated AddLotResult results = 1;
}

// The result of adding one of several lots.
message AddLotResult {
  // The lot added, with how its amount was converted, unset if it failed.
  AddToPantryResponse added = 1;
  // The code of the error, like "invalid_argument" or
  // "failed_precondition", empty if the lot was added.
  string error_code = 2;
  // What went wrong and what to do, empty if the lot was added.
  string error_message = 3;
}

message AddToPantryResponse {
  // The added lot.
  PantryItem item = 1;
  // How the amount was converted to grams, e.g. "148 ml at 1.17 g/ml is
  // 173 g" or "3 pieces at 50 g each is 150 g", empty if it was given in
  // grams.
  string conversion = 2;
  // Whether the food was always in stock, and track_stock cleared that.
  bool stopped_always_in_stock = 3;
}

message UpdatePantryItemRequest {
  // The lot, with its ID and the new values of the fields in update_mask.
  PantryItem item = 1;
  // The fields to update, e.g. "grams" or "opened_date". If empty, all
  // fields are replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePantryItemResponse {
  // The updated lot.
  PantryItem item = 1;
}

message RemoveFromPantryRequest {
  // The ID of the lot.
  string id = 1;
}

message RemoveFromPantryResponse {}
