syntax = "proto3";

package recipes.v1;

import "foods/v1/foods.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// RecipeService manages the household's recipes. A recipe's ingredients are
// the household's foods (see FoodService), so create or find the foods
// first, and its nutrition per serving and per 100 g is computed from them.
//
// Write recipes by these conventions, which the nutrition, the shopping
// list and the pantry rely on:
//
// 1. Amounts are in grams, milliliters or pieces, weighed with the food's grams_per_milliliter or grams_per_piece, or in the kitchen unit the source gives, like AMOUNT_UNIT_TABLESPOONS, which is converted and kept to show the recipe as written.
// 2. An ingredient is weighed as it goes into the recipe, with a food that matches that form: canned chickpeas drained, with a food for drained canned chickpeas, or chickpeas cooked from dry, with a food for cooked chickpeas.
// 3. Optional ingredients, like a garnish, aren't counted in the nutrition.
// 4. Servings are what the recipe really makes. A person's portion of a meal is in servings of its recipe, scaled for each person, so a serving should be one person's meal.
//
// The nutrition lists the ingredients whose data is missing, to fix on the
// foods with UpdateFood.
//
// An ingredient can also be another recipe, a component, like soaked and
// pressure cooked chickpeas in a chili: planning the chili also plans a
// cook of the chickpeas for it (see PlanService), and a component with
// prep_ahead_days shows on the plan the days before, like "Soak the
// chickpeas" the night before. A component's amount is in servings of its
// recipe, or by weight, volume or pieces of what it makes, like 400 g of
// chickpeas, converted with its recipe's yield_amount: set the yield on
// recipes used that way. Components can have components of their own, but
// no deeper, and a recipe can't use itself.
//
// A recipe can be saved as a draft, unfinished, with ingredients not yet
// matched to foods, only their original_text: drafts aren't planned or
// suggested. Finish one by matching its ingredients and saving it with
// draft false.
//
// To swap one food for another, like super-firm tofu for extra-firm, or
// canned beans for beans cooked from dry: find the recipes using it with
// ListRecipes and food_ids (with summary, to keep the list small), and
// replace it in all of them at once with ReplaceFood, with amount_ratio to
// scale the amounts. ListRecipes, ListFoods and PantryService.ListPantry
// all take summary for a smaller response.
//
// A recipe's steps are its instructions: each step's text, the ingredients
// it uses, how long it takes, whether it's waiting time, and the steps it
// follows. To write them:
//
// 1. Split the recipe into one action per step, and keep the amounts out of their texts: cook mode shows the step's ingredients with amounts scaled to the servings cooked.
// 2. Give each step the ingredients it uses, its duration from the text ("simmer for 20 minutes" is 1200 seconds), and set waiting for time the cook is free, like simmering, baking or resting.
// 3. Where one ingredient line is used in several steps, like salt for the sauce and the pasta water, give each step its part in ingredient_amounts: one amount per entry of ingredient_indexes, in the ingredient's unit, with 0 for all of it or for what the other steps leave. The parts can't add up to more than the line. Cook mode then shows each step its own part, not the whole line.
// 4. Say which steps can run alongside others: from_start for one that can start right away, or after_step_indexes for one that waits for steps other than the one before it. For a step that starts partway through the steps it follows, like pasta added 10 minutes into a 20 minute simmer, set start_offset_seconds (600) rather than splitting the simmer: it then starts that long after they start, counting from the latest start if there are several, not once they're done. With from_start, the offset counts from the recipe's start. For a step timed by when another ends, like preheating the oven to be ready 3 minutes before the marinating is done, follow that step and set end_before_seconds (180) instead.
// 5. Keep the steps in the order they read best: the timeline doesn't follow it, but puts whichever ready hands-on step leads the longest chain to the end first, so there's no need to reorder steps to get them to overlap.
// 6. Check the result with GetRecipeTimeline.
service RecipeService {
  // Get when a recipe's steps happen, for one cook: each starts as soon as
  // the steps it follows are done, or start_offset_seconds into them, and,
  // if it's hands-on, the cook is free, so hands-on steps fit into waiting
  // time, like chopping while rice simmers. When several hands-on steps
  // could start, the one leading the longest chain of steps to the end
  // goes first, whatever their order in the recipe, which only breaks
  // ties. Steps of unknown duration count as 5 minutes, and are marked
  // estimated.
  rpc GetRecipeTimeline(GetRecipeTimelineRequest) returns (GetRecipeTimelineResponse);
  // Create a recipe. Fails with INVALID_ARGUMENT if an ingredient's food
  // isn't one of the household's foods.
  rpc CreateRecipe(CreateRecipeRequest) returns (CreateRecipeResponse);
  // Get a recipe, with its ingredients, steps and nutrition, by its ID or
  // its name. Fails with NOT_FOUND naming the recipes with similar names if
  // no recipe has the name.
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  // List the household's recipes, ordered by name, optionally only those
  // matching a text or tags, using some foods, or only favorites. Returns summaries with the
  // main nutrients per serving; get a recipe with GetRecipe for the rest.
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  // Update a recipe. To mark it as a favorite, or unmark it, set favorite
  // with the update_mask "favorite".
  rpc UpdateRecipe(UpdateRecipeRequest) returns (UpdateRecipeResponse);
  // Update several recipes at once. Each is updated on its own, like UpdateRecipe, in parallel: the response
  // has a result per request, in order, with what was updated or the error.
  // At most 100 requests.
  rpc UpdateRecipes(UpdateRecipesRequest) returns (UpdateRecipesResponse);
  // Replace a food with another in the household's recipes, keeping each
  // ingredient's amount, unit, note and place, or scaling the amount: e.g.
  // replace canned black beans with black beans cooked from dry in every
  // recipe at once. Recipes using the food only through a component recipe
  // change through the component. An ingredient in pieces or milliliters
  // stays in them: if the new food can't be weighed in them, the recipe's
  // nutrition reports it, and grams_per_piece or grams_per_milliliter on
  // the new food fix it. Each recipe changes on its own: if some fail, the
  // error names them, and the others are changed.
  rpc ReplaceFood(ReplaceFoodRequest) returns (ReplaceFoodResponse);
  // Import a recipe from a web page, like a food blog's, as a draft (see
  // Recipe.draft): its name, servings, times, ingredients and steps are
  // read from the schema.org Recipe in the page's JSON-LD, which most
  // recipe sites have. Ingredients are kept as the page writes them, in
  // original_text, with their amounts and units where they can be read,
  // and matched to the household's food whose name is clearly the most
  // alike, ignoring word order, plurals and small typos (see
  // PreviewImport); the rest are left unmatched. Review the draft, match its
  // ingredients and give its steps their ingredients and durations, then
  // save it with draft false. Fails with FAILED_PRECONDITION if the page
  // can't be fetched or has no recipe data.
  rpc ImportRecipe(ImportRecipeRequest) returns (ImportRecipeResponse);
  // Read a recipe from a web page like ImportRecipe, without saving it,
  // with the household's foods most like each ingredient, to review: the
  // user picks each ingredient's food, then saves it with CreateRecipe,
  // as a draft if some are left unmatched. Fails like ImportRecipe.
  rpc PreviewImport(PreviewImportRequest) returns (PreviewImportResponse);
  // Delete a recipe. Fails with FAILED_PRECONDITION if cooks or staples of
  // the plan (see PlanService), or other recipes as a component, use it:
  // delete or change them first.
  rpc DeleteRecipe(DeleteRecipeRequest) returns (DeleteRecipeResponse);
}

// A recipe.
message Recipe {
  // The ID of the recipe. Required to update it, and ignored when creating
  // it.
  string id = 1;
  // The name of the recipe, e.g. "Chana masala". From 1 to 200 characters.
  string name = 2;
  // A short description of the dish. At most 2000 characters.
  string description = 3;
  // How many servings the recipe makes, from 1 to 100. Required. Nutrition
  // per serving divides the whole recipe by it.
  int32 servings = 4;
  // The hands-on preparation time, in seconds. 0 if unknown.
  int32 prep_seconds = 5;
  // The cooking time, in seconds, e.g. in the oven or simmering. 0 if
  // unknown.
  int32 cook_seconds = 6;
  // The ingredients, in the recipe's order. At most 100.
  repeated Ingredient ingredients = 7;
  // The texts of the instructions, in order: a plain view of them. Set
  // instructions to change them.
  repeated string steps = 8 [(mcp.v1.field).output_only = true];
  // Tags to find the recipe by, lowercase, e.g. "breakfast",
  // "batch-friendly" or "quick". Reuse the tags of other recipes (see
  // ListRecipesResponse.tags) rather than inventing synonyms. At most 20, of
  // at most 40 characters each.
  repeated string tags = 9;
  // The URL the recipe comes from, if any.
  string source_url = 10;
  // How many days leftovers keep in the fridge, e.g. 3. Unset if unknown, 0
  // if they don't keep. At most 14.
  optional int32 fridge_days = 11;
  // Whether leftovers can be frozen, to keep longer than fridge_days: see
  // Cook.frozen_servings.
  bool freezable = 12;
  // Notes, e.g. variations or what to serve it with. At most 5000
  // characters.
  string notes = 13;
  // The nutrition of the recipe, computed from its ingredients.
  RecipeNutrition nutrition = 14 [(mcp.v1.field).output_only = true];
  // When the recipe was created.
  google.protobuf.Timestamp create_time = 15 [(mcp.v1.field).output_only = true];
  // When the recipe was last changed.
  google.protobuf.Timestamp update_time = 16 [(mcp.v1.field).output_only = true];
  // Whether the household marked the recipe as a favorite.
  // SuggestionService.SuggestRecipes scores favorites higher, so they're
  // suggested more often. Only mark recipes the user says they like.
  bool favorite = 17;
  // How many days frozen leftovers keep, from the day it's cooked, e.g.
  // 90. Unset if unknown, so frozen leftovers aren't checked against a
  // limit. From 1 to 365.
  optional int32 freezer_days = 18;
  // How many days before it's cooked it starts, from 0 to 7, e.g. 1 for
  // beans soaked the night before. The plan shows prep_ahead_note on that
  // day. 0 if it starts the day it's cooked.
  int32 prep_ahead_days = 19;
  // What to do prep_ahead_days before, e.g. "Soak the chickpeas in plenty
  // of water". At most 500 characters.
  string prep_ahead_note = 20;
  // The steps, in order, with their structure: the ingredients each uses,
  // how long it takes, whether it's waiting time, and which steps it
  // follows. Cook mode shows each step with its ingredients and a timer,
  // and GetRecipeTimeline schedules them. At most 100.
  repeated Step instructions = 21;
  // What its ingredients cost, from their foods' prices.
  RecipeCost cost = 22 [(mcp.v1.field).output_only = true];
  // What the whole recipe makes, in yield_unit, e.g. 1200 g of cooked
  // chickpeas or 12 tortillas, so recipes using it as a component can give
  // its amount by weight, volume or pieces (see Ingredient.recipe_id). 0 if
  // not given: a component by weight then counts the weight of its
  // ingredients, raw, which leaves out water gained or lost cooking.
  double yield_amount = 23;
  // The unit of yield_amount, required with it: AMOUNT_UNIT_GRAMS,
  // AMOUNT_UNIT_MILLILITERS or AMOUNT_UNIT_PIECES, or a kitchen unit, which
  // is converted to its base unit.
  foods.v1.AmountUnit yield_unit = 24;
  // Whether it's a draft: saved unfinished, like a recipe being written or
  // imported from a web page. A draft's ingredients can be unmatched, with
  // only their original_text, and it isn't planned or suggested until
  // it's saved with draft false, which needs every ingredient matched to a
  // food or recipe.
  bool draft = 25;
  // Whether the household doesn't want it suggested (see
  // SuggestionService), like a recipe they didn't like. It can still be
  // planned by hand. Set it with the update_mask "not_suggested".
  bool not_suggested = 26;
  // The date (YYYY-MM-DD) it's not suggested before, like a recipe they
  // had enough of for a while; empty for none. Set it with the
  // update_mask "snoozed_until".
  string snoozed_until = 27;
}

// What a recipe's ingredients cost, from their foods' prices
// (FoodService's Food.price_cents_per_kilogram), for the grams used, not
// whole packs. Components count their own ingredients, and optional
// ingredients don't count.
message RecipeCost {
  // What the recipe's servings cost, in Canadian cents. A lower bound if
  // unpriced_food_names isn't empty.
  int32 total_cents = 1;
  // What a serving costs, in Canadian cents.
  int32 cents_per_serving = 2;
  // The foods without a price, or that can't be weighed, which aren't
  // counted: set their prices with FoodService.UpdateFood.
  repeated string unpriced_food_names = 3;
}

// A step of a recipe's instructions.
message Step {
  // What to do, e.g. "Simmer until the lentils are soft". Required, at most
  // 2000 characters. Leave the amounts out: cook mode shows the step's
  // ingredients with their amounts, scaled to the servings cooked.
  string text = 1;
  // The part of the recipe it's in, e.g. "For the sauce", empty if the
  // recipe has no parts. Steps with the same section in a row are shown
  // under one heading. At most 100 characters.
  string section = 2;
  // The ingredients it uses, by their index in the recipe's ingredients,
  // from 0. Reordering the ingredients changes what the indexes mean:
  // update the instructions with them.
  repeated int32 ingredient_indexes = 3;
  // For an ingredient split between steps, like salt for the sauce and
  // the pasta water, how much of it this step uses, in the ingredient's
  // unit: one for each of ingredient_indexes, 0 for all of it, or for the
  // rest of it after the other steps' amounts. Empty to use all of each.
  // An ingredient's amounts in all steps add up to at most its amount.
  // Cook mode shows each step's amount, scaled to the servings cooked.
  repeated double ingredient_amounts = 9;
  // How long it takes, in seconds, e.g. 1200 for "simmer for 20 minutes",
  // 0 if unknown, which the timeline counts as 5 minutes. At most 172800
  // (2 days); start longer soaking with the recipe's prep_ahead_days.
  int32 duration_seconds = 4;
  // Whether it's waiting time, when the cook is free, like simmering,
  // baking, rising or marinating, rather than hands-on work like chopping
  // or stirring. The timeline fits hands-on steps into it.
  bool waiting = 5;
  // The steps it starts after, by index, from 0, each before it, e.g. the
  // curry's "Serve" after both the rice and the sauce. Empty for the step
  // just before it.
  repeated int32 after_step_indexes = 6;
  // Whether it can start right away, after no other step, like boiling
  // water for pasta while the sauce starts. Leave after_step_indexes
  // empty.
  bool from_start = 7;
  // How long after the steps it follows start it starts, rather than once
  // they're done, in seconds: e.g. 600 for adding the pasta 10 minutes
  // into a 20 minute simmer. It counts from their start, not their end,
  // and from the latest start if it follows several, which isn't always
  // the order they're listed in: the timeline may do hands-on steps in
  // another order. To time a step by when another ends, use
  // end_before_seconds. With from_start, it counts from the recipe's
  // start. 0 to start once the steps it follows are done. At most 172800.
  int32 start_offset_seconds = 8;
  // Instead of starting once the steps it follows are done, ending this
  // long before the latest of them ends, in seconds, so it starts its
  // duration earlier: e.g. 180 to have the oven preheated 3 minutes
  // before the marinating is done, or 0 to finish as it does. Not before
  // the recipe starts, nor with start_offset_seconds, and only for a step
  // that follows others. At most 172800.
  optional int32 end_before_seconds = 10;
}

// An ingredient of a recipe: an amount of a food, or of another recipe, a
// component. A draft's ingredient can also be unmatched: only its
// original_text, with its amount and unit if known, until its food is
// chosen.
message Ingredient {
  // The ID of the household's food. Required, unless recipe_id is set, or
  // the ingredient is a draft's, unmatched.
  string food_id = 1;
  // The name of the food.
  string food_name = 2 [(mcp.v1.field).output_only = true];
  // The amount, in unit. More than 0, or 0 for an unmatched draft
  // ingredient whose amount isn't known.
  double amount = 3;
  // The unit of a food's amount. Required for a food. Amounts in
  // milliliters or pieces are weighed with the food's grams_per_milliliter
  // or grams_per_piece. For a component, unspecified for an amount in
  // servings of its recipe, or a unit of what its recipe makes, like 400 g
  // of cooked pinto beans, converted to servings with its recipe's
  // yield_amount (see component_servings).
  foods.v1.AmountUnit unit = 4;
  // How the food is prepared, e.g. "finely chopped" or "drained". At most
  // 200 characters.
  string note = 5;
  // The ingredient as the source recipe wrote it, e.g. "1 can (400 g)
  // chickpeas, drained", to check the conversion against. At most 500
  // characters.
  string original_text = 6;
  // Whether the ingredient is optional, like a garnish. Optional
  // ingredients aren't counted in the nutrition.
  bool optional = 7;
  // The ID of the household's recipe used as a component, instead of a
  // food, e.g. "Cooked chickpeas". Its nutrition counts per serving.
  string recipe_id = 8;
  // The name of the component's recipe.
  string recipe_name = 9 [(mcp.v1.field).output_only = true];
  // How the food's amounts are shown to people (see foods.v1.Food.measure),
  // and its density and piece weight, to convert them. Unset for a
  // component.
  foods.v1.Measure food_measure = 10 [(mcp.v1.field).output_only = true];
  double food_grams_per_milliliter = 11 [(mcp.v1.field).output_only = true];
  double food_grams_per_piece = 12 [(mcp.v1.field).output_only = true];
  // For a component, how many servings of its recipe the amount is: the
  // amount itself in servings, or converted with the recipe's yield_amount,
  // or for grams without one, the weight of its ingredients. 0 if it can't
  // be converted, as the recipe has no yield in that unit.
  double component_servings = 13 [(mcp.v1.field).output_only = true];
}

// The nutrition of a recipe, computed from its ingredients' foods, as
// weighed raw: water lost or absorbed in cooking isn't accounted for.
message RecipeNutrition {
  // The weight of the ingredients, in grams. It leaves out ingredients that
  // can't be weighed (see IngredientIssue.unknown_weight).
  double total_grams = 1;
  // The weight of a serving, in grams: total_grams divided by the servings.
  double grams_per_serving = 2;
  // The nutrients in a serving. A nutrient is unset if no ingredient's food
  // has it, and a lower bound if it's in incomplete_nutrients.
  foods.v1.Nutrients per_serving = 3;
  // The nutrients in 100 g of the recipe.
  foods.v1.Nutrients per_hundred_grams = 4;
  // The nutrients some ingredients lack, by their field name in Nutrients,
  // e.g. "iodine_micrograms", whose values are lower bounds. Empty if every
  // nutrient is complete.
  repeated string incomplete_nutrients = 5;
  // The ingredients whose data is missing, in the recipe's order. Fix them
  // on their foods with UpdateFood. A nutrient no ingredient has, which is
  // unset in per_serving, isn't an issue of every ingredient: most reference
  // foods lack some nutrients, like iodine.
  repeated IngredientIssue issues = 6;
}

// An ingredient whose food, or component's recipe, lacks data the recipe's
// nutrition needs.
message IngredientIssue {
  // The index of the ingredient in the recipe, from 0.
  int32 ingredient_index = 1;
  // The ID of the ingredient's food, empty for a component: fix the
  // component's own recipe instead.
  string food_id = 2;
  // The name of the ingredient's food or component.
  string food_name = 3;
  // Whether the amount can't be weighed, as the food has no
  // grams_per_piece (for pieces) or grams_per_milliliter (for
  // milliliters), or the component's recipe can't be weighed. The
  // ingredient is then left out of the nutrition entirely.
  bool unknown_weight = 4;
  // The nutrients the food lacks that other ingredients have, by their
  // field name in Nutrients, e.g. "vitamin_b12_micrograms". Empty if
  // unknown_weight.
  repeated string unknown_nutrients = 5;
  // Whether the ingredient isn't matched to a food or recipe yet, as a
  // draft's can be: set its food_id or recipe_id. It's left out of the
  // nutrition.
  bool unmatched = 6;
}

// A summary of a recipe, for lists.
message RecipeSummary {
  // The ID of the recipe.
  string id = 1;
  // The name of the recipe.
  string name = 2;
  // The description of the recipe.
  string description = 3;
  // How many servings the recipe makes.
  int32 servings = 4;
  // The preparation time, in seconds. 0 if unknown.
  int32 prep_seconds = 5;
  // The cooking time, in seconds. 0 if unknown.
  int32 cook_seconds = 6;
  // The tags of the recipe.
  repeated string tags = 7;
  // The energy in a serving, in kilocalories. Unset if unknown.
  optional double energy_kcal_per_serving = 8;
  // The protein in a serving, in grams. Unset if unknown.
  optional double protein_grams_per_serving = 9;
  // The carbohydrate in a serving, in grams. Unset if unknown.
  optional double carbohydrate_grams_per_serving = 10;
  // The weight of a serving, in grams.
  double grams_per_serving = 11;
  // Whether some ingredients lack data, so the nutrition is incomplete. Get
  // the recipe to see which.
  bool has_issues = 12;
  // When the recipe was last changed.
  google.protobuf.Timestamp update_time = 13;
  // Whether the household marked the recipe as a favorite.
  bool favorite = 14;
  reserved 15;
  reserved "has_instructions";
  // What a serving costs, in Canadian cents, from the foods' prices. Unset
  // if none of its foods have one; a lower bound if some don't (see
  // Recipe.cost).
  optional int32 cost_cents_per_serving = 16;
  // Whether it's a draft, which isn't planned or suggested (see
  // Recipe.draft).
  bool draft = 17;
  // Whether it's not suggested, and the date it's not suggested before
  // (see Recipe.not_suggested and Recipe.snoozed_until).
  bool not_suggested = 18;
  string snoozed_until = 19;
}

message CreateRecipeRequest {
  // The recipe.
  Recipe recipe = 1;
  // An ID the caller chooses for this request, like a UUID, to retry it
  // safely: a retry with the same request_id within a day returns the
  // first response instead of creating again. Empty to not deduplicate. At
  // most 100 characters.
  string request_id = 2;
}

message CreateRecipeResponse {
  // The created recipe.
  Recipe recipe = 1;
}

message GetRecipeRequest {
  // The ID of the recipe. Required, unless name is set.
  string id = 1;
  // The name of the recipe, ignoring case, instead of its ID.
  string name = 2;
  // Whether to return a summary: only the main nutrients (energy_kcal,
  // protein_grams and carbohydrate_grams), and none of the steps, original
  // ingredient texts, nutrition per 100 g, incomplete nutrients, ingredient
  // issues, or create and update times, nor fields at their default
  // values. Use it to scan, and read the full response only for what needs
  // a closer look.
  bool summary = 3;
}

message GetRecipeResponse {
  // The recipe.
  Recipe recipe = 1;
}

message ListRecipesRequest {
  // Only list recipes whose name or description contains this text,
  // ignoring case. Empty to list all.
  string query = 1;
  // Only list recipes with all of these tags. Empty to list all.
  repeated string tags = 2;
  // Only list the household's favorite recipes.
  bool favorites_only = 3;
  // Only list recipes with any of these foods as an ingredient, e.g. to
  // find the recipes to change when replacing a food. Recipes using a food
  // only through a component recipe aren't listed: the component is. Empty
  // to list all. At most 100.
  repeated string food_ids = 4;
  reserved 5;
  reserved "without_instructions";
  // Whether to return only each recipe's ID, name, servings, tags,
  // favorite, and main nutrients and cost per serving, leaving out its
  // description, times and weight, and any fields at their default values,
  // to keep a long list small.
  bool summary = 6;
}

message ListRecipesResponse {
  // The recipes, ordered by name.
  repeated RecipeSummary recipes = 1;
  // All the tags of the household's recipes, whether listed or not, in
  // alphabetical order.
  repeated string tags = 2;
}

message UpdateRecipeRequest {
  // The recipe, with its ID and the new values of the fields in
  // update_mask.
  Recipe recipe = 1;
  // The fields to update, e.g. "name,servings". If empty, all fields are
  // replaced. Lists, like ingredients and instructions, are replaced as a
  // whole.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateRecipeResponse {
  // The updated recipe.
  Recipe recipe = 1;
}

message GetRecipeTimelineRequest {
  // The ID of the recipe.
  string id = 1;
}

message GetRecipeTimelineResponse {
  // The steps, in the recipe's order, with when they happen.
  repeated TimedStep steps = 1;
  // From the first step's start to the last step's end, in seconds.
  int32 total_seconds = 2;
  // The time the cook works, not waiting, in seconds.
  int32 hands_on_seconds = 3;
}

// A step of a recipe's timeline.
message TimedStep {
  // The index of the step in the recipe's instructions.
  int32 step_index = 1;
  // The step's text.
  string text = 2;
  // When it starts, in seconds from the start of the recipe.
  int32 start_seconds = 3;
  // When it ends, in seconds from the start of the recipe.
  int32 end_seconds = 4;
  // Whether it's waiting time, when the cook is free.
  bool waiting = 5;
  // Whether its duration is unknown, and counted as 5 minutes.
  bool estimated = 6;
  // The step's section, empty if none.
  string section = 7;
}

message UpdateRecipesRequest {
  // The updates, each as UpdateRecipe takes it. At most 100.
  repeated UpdateRecipeRequest requests = 1;
}

message UpdateRecipesResponse {
  // A result per request, in order.
  repeated UpdateRecipeResult results = 1;
}

// The result of updating one of several recipes.
message UpdateRecipeResult {
  // The updated recipe, unset if it failed.
  Recipe recipe = 1;
  // The code of the error, like "invalid_argument" or "not_found", empty
  // if the recipe was updated.
  string error_code = 2;
  // What went wrong and what to do, empty if the recipe was updated.
  string error_message = 3;
}

message ReplaceFoodRequest {
  // The ID of the food to replace. Required.
  string food_id = 1;
  // The ID of the household's food to use instead. Required.
  string new_food_id = 2;
  // Only replace it in these recipes. Empty for every recipe using it. At
  // most 100.
  repeated string recipe_ids = 3;
  // What to multiply each amount by, e.g. 2.4 to replace 100 g of dried
  // chickpeas with 240 g of chickpeas cooked from dry. 0 to keep the
  // amounts.
  double amount_ratio = 4;
}

message ReplaceFoodResponse {
  // The recipes changed, by name.
  repeated RecipeSummary recipes = 1;
}

message DeleteRecipeRequest {
  // The ID of the recipe.
  string id = 1;
}

message DeleteRecipeResponse {}

message ImportRecipeRequest {
  // The address of the page, starting with http:// or https://. Required.
  string url = 1;
}

message PreviewImportRequest {
  // The address of the page, starting with http:// or https://. Required.
  string url = 1;
}

message PreviewImportResponse {
  // The recipe read, unsaved: a draft whose ingredients are unmatched,
  // with their original_text, and their amounts and units where they can
  // be read.
  Recipe recipe = 1;
  // The ingredients' likely foods, in the recipe's order.
  repeated ImportedIngredient ingredients = 2;
}

// What an imported ingredient likely is.
message ImportedIngredient {
  // The name of its food, read from its text, e.g. "almond milk" of "1
  // cup almond milk, unsweetened"; empty if none could be read.
  string name = 1;
  // The household's foods most like it, best first, at most 5.
  repeated FoodMatch matches = 2;
}

// A household's food an ingredient may be.
message FoodMatch {
  // The ID of the food.
  string food_id = 1;
  // The name of the food.
  string food_name = 2;
  // How alike the names are, from 0 to 1 for the same words.
  double score = 3;
}

message ImportRecipeResponse {
  // The draft recipe.
  Recipe recipe = 1;
  // How many of its ingredients were matched to the household's foods.
  int32 matched_ingredients = 2;
}
