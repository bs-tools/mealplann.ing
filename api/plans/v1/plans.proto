syntax = "proto3";

package plans.v1;

import "foods/v1/foods.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";
import "people/v1/people.proto";

// PlanService plans the household's meals, by week. Weeks start on Monday,
// and dates are local dates, "YYYY-MM-DD". A plan is made of:
//
// 1. Cooks: a recipe (see RecipeService) made on a date for a number of
//    servings, scaling the recipe, optionally as one of the household's
//    shared meals (breakfast, lunch or dinner). The ingredients are bought
//    and used once per cook.
// 2. Portions: what a person (see PersonService) eats at one of their
//    eating times on a date. A portion is either a share of a cook, in
//    servings, or an amount of a food without a recipe, like a handful of
//    nuts. A portion of a cook on a later date than the cook is a leftover:
//    batch cooking is one cook with portions over several days.
// 3. Staples: recurring portions, like a person's usual breakfast or daily
//    soy milk, on chosen weekdays until changed. They show in every week
//    without being copied, and can be skipped on a date, or marked eaten
//    on it with SetStapleEaten to take their food out of the pantry. A
//    staple is never taken out of the pantry by itself, whether skipped or
//    not: only marking it eaten does, after it's eaten.
//
// To plan a shared meal, use PlanMeal: it creates the cook and splits it
// into a portion for each person who eats from that meal, keeping each
// portion within the person's max_portion_grams by moving the rest of
// their serving to their next small meals. Plan anything else with
// CreateCook and CreatePortion. Then check the week with GetWeek: it gives
// each person's eating times with what they eat, their daily totals, and
// warnings where the plan breaks their rules or targets, or a leftover
// won't keep, each saying what to change. The rules and targets are the
// user's, from the person's care team: change the plan to meet them, never
// the rules.
service PlanService {
  // Estimate what a range of the plan costs, from the foods' prices
  // (FoodService's Food.price_cents_per_kilogram): each cook, the foods
  // eaten without a recipe, like staples, and in all, both for everything
  // eaten and for only what isn't in the pantry yet, which the pantry's
  // lots cover first by date, like the shopping list. Costs are for the
  // grams used, not whole packs. Foods without a price aren't counted, and
  // are listed. At most 31 days.
  rpc GetPlanCost(GetPlanCostRequest) returns (GetPlanCostResponse);
  // Get a week of the plan: for each day and person, their eating times
  // with the portions and staples planned, with weights and nutrients; the
  // day's totals; and every warning. Also the cooks of the week. Read it
  // after changing the plan, to check the warnings. A full week runs to
  // tens of kilobytes: set summary to read only the main nutrients.
  rpc GetWeek(GetWeekRequest) returns (GetWeekResponse);
  // Plan a shared household meal: create a cook of a recipe on a date for a
  // meal, and a portion of it for each person whose eating pattern eats
  // from that meal, at that eating time, unless they have a staple there
  // that day that replaces_meal, which they eat instead, nor people
  // eating out (see SetEatingOut). Each person gets one serving, or
  // someone with daily targets (see PersonService) from half a serving to
  // two, in quarters, whichever brings their day closest to them: a
  // daily minimum counts for the share of their day planned, this meal's
  // eating time included, and a maximum for the whole day. The cook makes
  // the servings rounded up to whole ones, leaving the rest over. If a
  // serving weighs more than a person's max_portion_grams, their portion is
  // capped at it (less what's already planned at that eating time), and the
  // rest of their serving goes to their next small eating times that day,
  // then the next day's, as portions of the same cook. A part that doesn't
  // fit is left unassigned. Returns the cook, the portions and the warnings
  // of the eating times and cook it touched. Fails with
  // FAILED_PRECONDITION if nobody eats from the meal, or everyone who does
  // has a staple that replaces it that day.
  rpc PlanMeal(PlanMealRequest) returns (PlanMealResponse);
  // Plan several shared meals, or one person's eating times, at once, like
  // PlanMeal for each shared meal, in order of date and meal, so each
  // splits its portions given those before it. An eating time of one
  // person gets a cook for their portion: a serving, or less if their
  // max_portion_grams says so. Each date's shared meals are planned before
  // its eating times of one person. Use it to save a plan from
  // SuggestionService.SuggestPlan. Nothing is planned if any meal fails.
  // Fails with INVALID_ARGUMENT if two meals are at the same date and meal
  // or eating time, and FAILED_PRECONDITION if nobody eats from a meal.
  rpc PlanMeals(PlanMealsRequest) returns (PlanMealsResponse);
  // Create a cook: a recipe made on a date. Plan who eats it with
  // CreatePortion, or use PlanMeal to do both. A cook created done takes
  // its ingredients out of the pantry, like UpdateCook, unless it's
  // from_stock: food already made, like a tray of lasagne ragù in the
  // freezer, entered with frozen_servings to show in ListFrozenLeftovers
  // and plan from.
  rpc CreateCook(CreateCookRequest) returns (CreateCookResponse);
  // Update a cook. Its portions stay, so moving a cook to a later date can
  // leave portions before it, which GetWeek warns about. Marking it done
  // takes its ingredients, scaled to its servings and without optional
  // ones, out of the pantry (see PantryService), from the lots that expire
  // first, as far as they're in stock; un-marking it puts back exactly what
  // was taken out. Changing a done cook's recipe or servings doesn't change
  // the pantry: un-mark it first, then mark it done again. When marking it
  // done, food_uses say what was actually used where it differs from the
  // recipe: another amount, a substitute food, or none at all, and preview
  // returns the pantry changes without making them or marking it done.
  rpc UpdateCook(UpdateCookRequest) returns (UpdateCookResponse);
  // Delete a cook. Its portions are deleted too, and the cooks planned only
  // to supply its components, if nobody eats them and they aren't done.
  // The pantry doesn't change, even if it was done.
  rpc DeleteCook(DeleteCookRequest) returns (DeleteCookResponse);
  // Set which cook supplies a component of a cook (see Cook.supplies), e.g.
  // to make one pot of chickpeas on Monday for Tuesday's chili and
  // Thursday's curry. The supplier must be a cook of the component's
  // recipe. The cook that supplied it before is deleted if nothing uses
  // it any more: nobody eats it, it supplies no other cook, and it isn't
  // done. The supplier's servings are raised to make enough for the cook
  // too, if they'd be too few.
  rpc SetCookSupplier(SetCookSupplierRequest) returns (SetCookSupplierResponse);
  // Create a portion: what a person eats at one of their eating times on a
  // date, either a share of a cook or an amount of a food. With new_cook,
  // the cook is created with it, on its date: a recipe cooked for one
  // person's eating time, like a recipe of one or two servings cooked and
  // eaten right away.
  rpc CreatePortion(CreatePortionRequest) returns (CreatePortionResponse);
  // Update a portion, e.g. move it to another date or eating time, or
  // change its servings.
  rpc UpdatePortion(UpdatePortionRequest) returns (UpdatePortionResponse);
  // Delete a portion.
  rpc DeletePortion(DeletePortionRequest) returns (DeletePortionResponse);
  // Create a staple: a portion a person eats regularly at one of their
  // eating times, on chosen weekdays.
  rpc CreateStaple(CreateStapleRequest) returns (CreateStapleResponse);
  // List the household's staples, ordered by person and eating time.
  rpc ListStaples(ListStaplesRequest) returns (ListStaplesResponse);
  // Update a staple. The change applies to every date it's on, past ones
  // too: to change it from a date on, set end_date on this one and create
  // another.
  rpc UpdateStaple(UpdateStapleRequest) returns (UpdateStapleResponse);
  // Delete a staple, from every date.
  rpc DeleteStaple(DeleteStapleRequest) returns (DeleteStapleResponse);
  // Skip a staple on a date, e.g. when the person eats out: it's left out
  // of that day's nutrition and shopping list. Skipping doesn't change the
  // pantry, and not skipping doesn't either: a staple only comes out of the
  // pantry when it's marked eaten with SetStapleEaten. Skipping a date
  // that's already skipped does nothing.
  rpc SkipStaple(SkipStapleRequest) returns (SkipStapleResponse);
  // Stop skipping a staple on a date.
  rpc UnskipStaple(UnskipStapleRequest) returns (UnskipStapleResponse);
  // Mark a staple eaten on a date, taking its food, or its recipe's
  // ingredients scaled to its servings without the optional ones, out of
  // the pantry, from the lots that expire first, as far as they're in
  // stock; or un-mark it, putting back what it took out. Marking a date
  // that's already marked does nothing, and marking a skipped date stops
  // skipping it. Staples aren't taken out of the pantry unless marked
  // eaten, and shopping lists don't buy for the dates they're marked
  // eaten on, as they're out of the pantry already.
  rpc SetStapleEaten(SetStapleEatenRequest) returns (SetStapleEatenResponse);
  // List what's in the freezer: the frozen leftovers of cooks (see
  // Cook.frozen_servings) not all planned or taken yet, by the date they
  // were cooked, each with the servings left and the last date they keep.
  // Take them out with TakeFromFreezer.
  rpc ListFrozenLeftovers(ListFrozenLeftoversRequest) returns (ListFrozenLeftoversResponse);
  // Take servings of a cook's frozen leftovers out of the freezer: for a
  // person's eating time on a date, as a portion of the cook, or off plan,
  // when they were eaten without being planned, given away or thrown out,
  // which adds to the cook's off_plan_servings. Either way they're no
  // longer in the freezer, and don't count as unassigned. A portion can be
  // on any date from the cook's, like food frozen the day it was cooked and
  // eaten a few days later, and is marked from_freezer. Fails with
  // FAILED_PRECONDITION if the freezer has fewer of them.
  rpc TakeFromFreezer(TakeFromFreezerRequest) returns (TakeFromFreezerResponse);
  // Mark that people eat out at a meal on a date, like lunch at a
  // restaurant or dinner at a friend's, or stop marking it: either a
  // shared meal, for everyone who eats it or the people given, or one
  // person's eating time. Nothing is planned there: PlanMeal, PlanMeals
  // and the suggestions (see SuggestionService) leave them out, their
  // staples at it are left out of the day's nutrition and shopping, as if
  // skipped, and GetWeek shows it eaten out, with what it eats unknown, so
  // the day's minimums are uncertain. Fails with FAILED_PRECONDITION if
  // something is planned there already, as a portion or a staple marked
  // eaten: remove it with DeletePortion, or un-mark it with
  // SetStapleEaten, first. Marking an eating time already eaten out at
  // changes its notes.
  rpc SetEatingOut(SetEatingOutRequest) returns (SetEatingOutResponse);
}

// A recipe made on a date, for a number of servings.
message Cook {
  // The ID of the cook. Required to update it, and ignored when creating
  // it.
  string id = 1;
  // The ID of the household's recipe. Required.
  string recipe_id = 2;
  // The name of the recipe.
  string recipe_name = 3 [(mcp.v1.field).output_only = true];
  // The date it's cooked on (YYYY-MM-DD). Required.
  string date = 4;
  // How many servings are cooked, from 0.25 to 100, scaling the recipe by
  // servings divided by the recipe's servings. Required.
  double servings = 5;
  // The shared meal it's cooked for, HOUSEHOLD_MEAL_UNSPECIFIED if none,
  // e.g. for batch cooking.
  people.v1.HouseholdMeal meal = 6;
  // Notes, e.g. "double the spices". At most 2000 characters.
  string notes = 7;
  // Whether it's been cooked. Marking it done takes its ingredients out of
  // the pantry, see UpdateCook.
  bool done = 8;
  // When the cook was created.
  google.protobuf.Timestamp create_time = 9 [(mcp.v1.field).output_only = true];
  // When the cook was last changed.
  google.protobuf.Timestamp update_time = 10 [(mcp.v1.field).output_only = true];
  // How many of its servings are frozen on the day it's cooked, from 0 to
  // servings, to keep for the recipe's freezer_days rather than its
  // fridge_days. Its portions eaten after the fridge days come from them,
  // and those not planned yet are in the freezer (see
  // ListFrozenLeftovers), to plan later. 0 if none.
  double frozen_servings = 11;
  // The cooks making its recipe's components, e.g. the pot of chickpeas
  // for a chili. Creating a cook of a recipe with components also creates
  // a cook of each, on the same date, for the servings it needs, unless
  // the components are made in it: change the supplier with
  // SetCookSupplier.
  repeated CookSupply supplies = 12 [(mcp.v1.field).output_only = true];
  // The cooks it makes a component of.
  repeated CookSupply supplying = 13 [(mcp.v1.field).output_only = true];
  // How many of its servings were taken without a portion: eaten without
  // being planned, given away or thrown out, like a frozen serving grabbed
  // for a lunch. They count as used, so they're neither unassigned nor in
  // the freezer. Add to it with TakeFromFreezer. From 0 to servings.
  double off_plan_servings = 14;
}

// A cook making a component of another cook: e.g. a pot of chickpeas for
// a chili.
message CookSupply {
  // The ID of the cook using the component.
  string consumer_cook_id = 1;
  // The name of its recipe.
  string consumer_recipe_name = 2;
  // Its date (YYYY-MM-DD).
  string consumer_date = 3;
  // The ID of the component's recipe.
  string component_recipe_id = 4;
  // The ID of the cook making the component.
  string supplier_cook_id = 5;
  // The name of its recipe.
  string supplier_recipe_name = 6;
  // Its date (YYYY-MM-DD).
  string supplier_date = 7;
  // The servings of the component the consumer uses, from its servings
  // and its recipe's amount of the component.
  double servings = 8;
}

// A share of a cook, in servings.
message CookShare {
  // The ID of the cook. Required.
  string cook_id = 1;
  // How many servings of the cook, more than 0 and at most 20, e.g. 0.5.
  double servings = 2;
}

// A number of servings of a recipe, without a cook.
message RecipeServings {
  // The ID of the household's recipe. Required.
  string recipe_id = 1;
  // How many servings, more than 0 and at most 20, e.g. 0.5.
  double servings = 2;
}

// An amount of a food, without a recipe.
message FoodAmount {
  // The ID of the household's food. Required.
  string food_id = 1;
  // The amount, in unit. More than 0 and at most 5000.
  double amount = 2;
  // The unit of the amount. Required. Milliliters and pieces are weighed
  // with the food's grams_per_milliliter and grams_per_piece.
  foods.v1.AmountUnit unit = 3;
}

// What a person eats at one of their eating times on a date.
message Portion {
  // The ID of the portion. Required to update it, and ignored when creating
  // it.
  string id = 1;
  // The ID of the person. Required.
  string person_id = 2;
  // The ID of one of the person's eating times. Required.
  string eating_time_id = 3;
  // The date it's eaten on (YYYY-MM-DD). Required. A date after the cook's
  // makes it a leftover.
  string date = 4;
  // What's eaten. Required.
  oneof what {
    // A share of a cook.
    CookShare cook = 5;
    // An amount of a food, like a handful of nuts.
    FoodAmount food = 6;
  }
  // Notes, e.g. "with a squeeze of lemon". At most 500 characters.
  string notes = 7;
  // The name of the cook's recipe or of the food.
  string name = 8 [(mcp.v1.field).output_only = true];
  // When the portion was created.
  google.protobuf.Timestamp create_time = 9 [(mcp.v1.field).output_only = true];
  // When the portion was last changed.
  google.protobuf.Timestamp update_time = 10 [(mcp.v1.field).output_only = true];
  // Whether a share of a cook is eaten from its frozen servings, taken
  // out of the freezer with TakeFromFreezer, whatever its date. Portions
  // after the recipe's fridge_days come from the freezer too.
  bool from_freezer = 11 [(mcp.v1.field).output_only = true];
}

// Weekday is a day of the week.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// A portion a person eats regularly. It's counted in each day's nutrition
// and shopping list unless skipped, but only taken out of the pantry when
// marked eaten on a date (see SetStapleEaten and PlannedPortion.eaten).
message Staple {
  // The ID of the staple. Required to update it, and ignored when creating
  // it.
  string id = 1;
  // The ID of the person. Required.
  string person_id = 2;
  // The ID of one of the person's eating times. Required.
  string eating_time_id = 3;
  // What's eaten. Required.
  oneof what {
    // Servings of a recipe, e.g. overnight oats made each morning.
    RecipeServings recipe = 4;
    // An amount of a food, e.g. 250 ml of soy milk.
    FoodAmount food = 5;
  }
  // The weekdays it's eaten on, without repeats. Empty for every day.
  repeated Weekday weekdays = 6;
  // The first date it's eaten on (YYYY-MM-DD). Empty if it has no start;
  // set it to today for a new habit, so past weeks don't change.
  string start_date = 7;
  // The last date it's eaten on (YYYY-MM-DD), on or after start_date. Empty
  // if it goes on.
  string end_date = 8;
  // Notes. At most 500 characters.
  string notes = 9;
  // The name of the recipe or food.
  string name = 10 [(mcp.v1.field).output_only = true];
  // The dates it's skipped on (YYYY-MM-DD), in order. Change them with
  // SkipStaple and UnskipStaple.
  repeated string skipped_dates = 11 [(mcp.v1.field).output_only = true];
  // When the staple was created.
  google.protobuf.Timestamp create_time = 12 [(mcp.v1.field).output_only = true];
  // When the staple was last changed.
  google.protobuf.Timestamp update_time = 13 [(mcp.v1.field).output_only = true];
  // Whether the person eats it instead of the shared meal at its eating
  // time, like their own breakfast, so the meal isn't planned or suggested
  // for them on the days it's eaten. False for what's had with the meal,
  // like a cup of tea at breakfast.
  bool replaces_meal = 14;
}

// WarningKind is what a warning is about.
enum WarningKind {
  WARNING_KIND_UNSPECIFIED = 0;
  // An eating time weighs more than the person's max_portion_grams.
  WARNING_KIND_PORTION_TOO_LARGE = 1;
  // An eating time has less protein than the person's min_protein_grams.
  WARNING_KIND_PROTEIN_LOW = 2;
  // An eating time has more carbohydrate than the person's
  // max_carbohydrate_grams.
  WARNING_KIND_CARBOHYDRATE_HIGH = 3;
  // An eating time's carbohydrate isn't paired with enough protein and fat:
  // its (protein + fat) / carbohydrate is under the person's
  // min_pairing_ratio.
  WARNING_KIND_CARBOHYDRATE_UNPAIRED = 4;
  // An eating time has more sugars than the person's max_sugars_grams.
  WARNING_KIND_SUGARS_HIGH = 5;
  // An eating time has foods marked fast_carb, and the person has
  // warn_fast_carbs.
  WARNING_KIND_FAST_CARBS = 6;
  // An eating time's weight is only partly known, as some foods can't be
  // weighed, so its max_portion_grams can't be fully checked.
  WARNING_KIND_WEIGHT_UNKNOWN = 7;
  // A day has less of a nutrient than the person's daily minimum.
  WARNING_KIND_TARGET_LOW = 8;
  // A day has more of a nutrient than the person's daily maximum.
  WARNING_KIND_TARGET_HIGH = 9;
  // A leftover is eaten later than the recipe's fridge_days after it's
  // cooked, and the recipe isn't freezable.
  WARNING_KIND_LEFTOVER_PAST_FRIDGE_DAYS = 10;
  // A leftover is eaten later than the recipe's fridge_days after it's
  // cooked, but the recipe is freezable: freeze it in time.
  WARNING_KIND_LEFTOVER_FREEZE = 11;
  // A portion is eaten before its cook is cooked.
  WARNING_KIND_PORTION_BEFORE_COOK = 12;
  // Some of a cook's servings aren't planned for anyone.
  WARNING_KIND_SERVINGS_UNASSIGNED = 13;
  // A cook's portions add up to more servings than it makes.
  WARNING_KIND_SERVINGS_OVERASSIGNED = 14;
  // A leftover comes from the freezer: thaw it in the fridge the day
  // before.
  WARNING_KIND_LEFTOVER_THAW = 15;
  // A leftover from the freezer is eaten after it stops keeping frozen.
  WARNING_KIND_LEFTOVER_PAST_FREEZER_DAYS = 16;
  // A cook's component is cooked after it, by the cook supplying it.
  WARNING_KIND_COMPONENT_AFTER_COOK = 18;
  // More of a cook's servings are planned after they stop keeping in the
  // fridge than are frozen: freeze more, or eat them sooner.
  WARNING_KIND_FROZEN_SERVINGS_SHORT = 17;
}

// Severity is how much a warning matters.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  // Something to change.
  SEVERITY_WARNING = 1;
  // Something to know, like a leftover to freeze or servings left over.
  SEVERITY_INFO = 2;
}

// A problem with the plan, saying what to change.
message Warning {
  // What it's about.
  WarningKind kind = 1;
  // How much it matters.
  Severity severity = 2;
  // What's wrong and what to change, for the user, e.g. "Mid-morning has 6
  // g of protein, under the minimum of 10 g: add a protein food".
  string message = 3;
  // Whether it may be wrong, as some foods lack data: a nutrient that's
  // missing from some foods is a lower bound, so a "low" warning may be
  // fine. Complete the foods with FoodService.UpdateFood.
  bool uncertain = 4;
  // The person it's about, empty for a cook's servings.
  string person_id = 5;
  // The date it's about (YYYY-MM-DD), empty for a cook's servings.
  string date = 6;
  // The eating time it's about, empty for daily targets and a cook's
  // servings.
  string eating_time_id = 7;
  // The cook it's about, for leftovers and servings, empty otherwise.
  string cook_id = 8;
  // The nutrient, for daily targets, NUTRIENT_UNSPECIFIED otherwise.
  foods.v1.Nutrient nutrient = 9;
  // The planned amount checked, in the rule's unit, e.g. grams of protein,
  // or days for leftovers and servings for a cook.
  double value = 10;
  // The rule's limit, in the same unit.
  double limit = 11;
}

message GetWeekRequest {
  // The Monday the week starts on (YYYY-MM-DD). Required.
  string monday = 1;
  // Whether to return a summary: only the main nutrients (energy_kcal,
  // protein_grams and carbohydrate_grams), and none of the steps, original
  // ingredient texts, nutrition per 100 g, incomplete nutrients, ingredient
  // issues, or create and update times, nor fields at their default
  // values. Use it to scan, and read the full response only for what needs
  // a closer look.
  bool summary = 2;
}

message GetWeekResponse {
  // The Monday the week starts on (YYYY-MM-DD).
  string monday = 1;
  // The seven days of the week, from Monday.
  repeated PlanDay days = 2;
  // The cooks of the week, by date.
  repeated PlannedCook cooks = 3;
  // Cooks of the weeks before, of up to 14 days before Monday, whose
  // leftovers still keep in the fridge on Monday, by their recipe's
  // fridge_days, and have servings not planned yet, by date: like
  // Sunday's pot of chili, to plan portions of in this week with
  // CreatePortion.
  repeated PlannedCook earlier_leftovers = 4;
}

// A day of the plan.
message PlanDay {
  // The date (YYYY-MM-DD).
  string date = 1;
  // Each person's day, ordered by name.
  repeated PersonDay people = 2;
  // What to start on the day for cooks on later days, like soaking beans
  // the night before.
  repeated PrepTask prep_tasks = 3;
}

// Something to start ahead of a cook: its recipe's prep_ahead_note,
// prep_ahead_days before it.
message PrepTask {
  // The ID of the cook.
  string cook_id = 1;
  // The name of its recipe.
  string recipe_name = 2;
  // The date of the cook (YYYY-MM-DD).
  string cook_date = 3;
  // What to do, e.g. "Soak the chickpeas". The recipe's prep_ahead_note,
  // or "Start <recipe>" if it has none.
  string note = 4;
  // The recipes of the cooks it makes a component of, e.g. "Chili", by
  // date.
  repeated string for_recipe_names = 5;
}

// A person's day of the plan.
message PersonDay {
  // The ID of the person.
  string person_id = 1;
  // The name of the person.
  string person_name = 2;
  // The person's eating times, in order, with what's planned at them.
  repeated PlannedEatingTime eating_times = 3;
  // The total weight of the day, in grams, of what can be weighed.
  double grams = 4;
  // The nutrients of the day. A nutrient is a lower bound if it's in
  // incomplete_nutrients, and unset if no food has it.
  foods.v1.Nutrients nutrients = 5;
  // The nutrients some planned foods lack, by their field name in
  // Nutrients, e.g. "iodine_micrograms".
  repeated string incomplete_nutrients = 6;
  // The warnings of the day's targets. The eating times have their own.
  repeated Warning warnings = 7;
}

// An eating time of a person's day, with what's planned at it.
message PlannedEatingTime {
  // The eating time.
  people.v1.EatingTime eating_time = 1;
  // The portions and staples planned, staples first.
  repeated PlannedPortion portions = 2;
  // The weight of the eating time, in grams, of what can be weighed.
  double grams = 3;
  // The energy and macronutrients of the eating time, energy_kcal to
  // fiber_grams; the other nutrients are only in the day's totals. A
  // nutrient is a lower bound if some foods lack it, and unset if none
  // have it.
  foods.v1.Nutrients nutrients = 4;
  // The warnings of the eating time, including those of its leftovers.
  repeated Warning warnings = 5;
  // Whether the person eats out at it on the date (see SetEatingOut), so
  // nothing is planned there, and its staples are left out.
  bool eating_out = 6;
  // The notes of eating out, like where.
  string eating_out_notes = 7;
}

// A portion or staple planned at an eating time.
message PlannedPortion {
  // The ID of the portion, empty for a staple.
  string portion_id = 1;
  // The ID of the staple it comes from, empty for a portion.
  string staple_id = 2;
  // The ID of the cook it's a share of, empty if none.
  string cook_id = 3;
  // The ID of the recipe, of the cook or staple, empty for a food.
  string recipe_id = 4;
  // The ID of the food, empty for a recipe.
  string food_id = 5;
  // The name of the recipe or food.
  string name = 6;
  // The servings of the cook or recipe, 0 for a food.
  double servings = 7;
  // The amount of the food, 0 for a recipe.
  double amount = 8;
  // The unit of the food's amount, AMOUNT_UNIT_UNSPECIFIED for a recipe.
  foods.v1.AmountUnit unit = 9;
  // The weight, in grams, of what can be weighed.
  double grams = 10;
  // Whether some or all of it can't be weighed, so grams is a lower bound.
  bool unknown_weight = 11;
  // The date of the cook (YYYY-MM-DD), for shares of a cook.
  string cook_date = 12;
  // Whether it's a leftover: a share of a cook cooked on an earlier date.
  bool leftover = 13;
  // The notes of the portion or staple.
  string notes = 14;
  // Whether the staple was marked eaten on the date (see SetStapleEaten),
  // which took its food out of the pantry. False for a portion.
  bool eaten = 15;
}

// A cook of the week, with how its servings are planned.
message PlannedCook {
  // The cook.
  Cook cook = 1;
  // The servings planned for people, in all its portions, of any week, and
  // for the cooks it supplies.
  double assigned_servings = 2;
  // The warnings about its servings.
  repeated Warning warnings = 3;
  // The servings left in the fridge to plan as leftovers: not frozen, nor
  // planned in portions within the recipe's fridge days, nor supplying
  // other cooks. 0 if they're all planned.
  double left_servings = 4;
}

message GetPlanCostRequest {
  // The first date (YYYY-MM-DD). Required.
  string start_date = 1;
  // The last date (YYYY-MM-DD), at most 30 days after start_date.
  // Required.
  string end_date = 2;
}

message GetPlanCostResponse {
  // What everything planned costs, in Canadian cents.
  int32 total_cents = 1;
  // What's left to buy: everything planned, but what the pantry has
  // already, in Canadian cents.
  int32 to_buy_cents = 2;
  // The cooks, by date, each with what its ingredients cost. A cook whose
  // components another cook makes doesn't count them; that cook does.
  repeated CookCost cooks = 3;
  // What the foods eaten without a recipe cost, like staples and portions
  // of a food, in Canadian cents.
  int32 foods_cents = 4;
  // The foods without a price, or that can't be weighed, which aren't
  // counted, by name: set their prices with FoodService.UpdateFood.
  repeated string unpriced_food_names = 5;
}

// What a cook's ingredients cost.
message CookCost {
  // The ID of the cook.
  string cook_id = 1;
  // The name of its recipe.
  string recipe_name = 2;
  // The date of the cook (YYYY-MM-DD).
  string date = 3;
  // The servings cooked.
  double servings = 4;
  // What its ingredients cost, in Canadian cents.
  int32 total_cents = 5;
  // What a serving costs, in Canadian cents.
  int32 cents_per_serving = 6;
}

message PlanMealRequest {
  // The ID of the household's recipe to cook. Required.
  string recipe_id = 1;
  // The date (YYYY-MM-DD). Required.
  string date = 2;
  // The shared meal. Required.
  people.v1.HouseholdMeal meal = 3;
  // The people to plan for, each of whom must have an eating time for the
  // meal, even if they have a staple that replaces it. Empty for everyone
  // who does and has no such staple that day.
  repeated string person_ids = 4;
  // How many servings to cook, at least the servings planned for people;
  // the rest are left over, to plan later with CreatePortion. 0 for the
  // servings planned for people, rounded up to a whole number.
  double servings = 5;
  // Notes for the cook. At most 2000 characters.
  string notes = 6;
}

message PlanMealResponse {
  // The created cook.
  Cook cook = 1;
  // The created portions, by person and date.
  repeated Portion portions = 2;
  // The servings nobody is planned to eat.
  double unassigned_servings = 3;
  // The warnings of the eating times the portions are at, and of the cook.
  repeated Warning warnings = 4;
}

// A shared meal to plan with PlanMeals.
message MealToPlan {
  // The ID of the household's recipe to cook. Required.
  string recipe_id = 1;
  // The date (YYYY-MM-DD). Required.
  string date = 2;
  // The shared meal. Required, unless eating_time_id is set.
  people.v1.HouseholdMeal meal = 3;
  // Instead of a shared meal, the person whose eating time it is, with
  // eating_time_id: e.g. one person's snack mid-morning.
  string person_id = 4;
  // The person's eating time, with person_id.
  string eating_time_id = 5;
  // For one person's eating time, instead of a new cook of recipe_id, the
  // rest of an earlier shared meal, reheated: a serving more of that
  // meal's cook of recipe_id, which grows by it. The cook is one planned
  // by this request, or else already. SuggestRecipes and SuggestPlan
  // suggest these as their suggestions' leftover_of.
  LeftoverOf leftover_of = 6;
  // The date to cook it (YYYY-MM-DD), up to 14 days before date, to batch
  // cook it ahead and eat it as leftovers, like on the household's cooking
  // day; empty to cook it on date. A cook made ahead isn't one of its
  // date's shared meals. SuggestPlan suggests these as cook_date.
  string cook_date = 7;
}

// LeftoverOf is an earlier shared meal whose cook a portion is the rest
// of.
message LeftoverOf {
  // The date of the meal (YYYY-MM-DD), on or before the portion's.
  // Required.
  string date = 1;
  // The shared meal. Required.
  people.v1.HouseholdMeal meal = 2;
}

message PlanMealsRequest {
  // The meals to plan, from 1 to 150, at most one per date and meal or
  // eating time. Each shared meal is cooked for everyone who eats from it,
  // with the servings planned for them.
  repeated MealToPlan meals = 1;
}

message PlanMealsResponse {
  // The created cooks, by date and meal.
  repeated Cook cooks = 1;
  // How many portions were created for people.
  int32 portion_count = 2;
}

message CreateCookRequest {
  // The cook.
  Cook cook = 1;
  // Whether it's food already made before the household tracked it, like
  // leftovers in the freezer or a batch of cooked rice: the cook is created
  // done, on the date it was made, without taking its ingredients out of
  // the pantry, which no longer has them, or planning cooks of its
  // components, which it already has. Set the cook's frozen_servings to
  // what's frozen. Use it instead of a custom food for cooked food in
  // stock, so it keeps its recipe's nutrition.
  bool from_stock = 2;
}

message CreateCookResponse {
  // The created cook.
  Cook cook = 1;
  // What was taken out of the pantry, if the cook was created done.
  repeated PantryChange pantry_changes = 2;
}

// An amount of a food taken out of the pantry, or put back, by marking a
// cook done or not.
message PantryChange {
  // The ID of the food.
  string food_id = 1;
  // The name of the food.
  string food_name = 2;
  // The grams taken out or put back.
  double grams = 3;
}

message UpdateCookRequest {
  // The cook, with its ID and the new values of the fields in update_mask.
  Cook cook = 1;
  // The fields to update, e.g. "done" or "date,servings". If empty, all
  // fields are replaced.
  google.protobuf.FieldMask update_mask = 2;
  // When marking the cook done, what was actually used of some foods,
  // where it differs from the recipe's amounts scaled to the servings:
  // e.g. two whole blocks of tofu, an onion already taken out by hand, or
  // ginger the household didn't have. The pantry is taken from as they
  // say, and the others as the recipe says. Only with done changing to
  // true. At most 100, one per food.
  repeated FoodUse food_uses = 3;
  // Whether to only return the pantry_changes marking the cook done would
  // make, with food_uses, without making them or changing the cook, to
  // check them first. Only with done changing to true.
  bool preview = 4;
}

// What was actually used of a food when cooking, instead of what the
// recipe says.
message FoodUse {
  // The ID of a food of the recipe, including its components made in the
  // cook. A food the recipe doesn't use is an extra one, taken out of the
  // pantry by its amount. Required.
  string food_id = 1;
  // How much was used, in unit, instead of the recipe's amount scaled to
  // the servings, e.g. 2 pieces of tofu. Unset for the recipe's amount,
  // also of a substitute. Required for an extra food.
  optional double amount = 2;
  // The unit of amount, weighed with the food's grams_per_piece or
  // grams_per_milliliter. Required with amount.
  foods.v1.AmountUnit unit = 3;
  // The ID of the household's food used instead of it, e.g. extra-firm
  // tofu for super-firm: the pantry is taken from that food, by amount,
  // or the recipe's weight. Empty if none.
  string substitute_food_id = 4;
  // Whether none of it was used, e.g. as the household had none, or it
  // was already taken out of the pantry by hand, so nothing's taken out
  // for it.
  bool skipped = 5;
}

message UpdateCookResponse {
  // The updated cook.
  Cook cook = 1;
  // What marking the cook done took out of the pantry, or un-marking it put
  // back. Empty if done didn't change, or nothing was in stock.
  repeated PantryChange pantry_changes = 2;
  // Whether pantry_changes were put back, rather than taken out.
  bool pantry_restored = 3;
  // Whether this is a preview: the pantry and the cook haven't changed,
  // and pantry_changes are what marking it done would take out.
  bool previewed = 4;
}

message DeleteCookRequest {
  // The ID of the cook.
  string id = 1;
}

message DeleteCookResponse {}

message CreatePortionRequest {
  // The portion.
  Portion portion = 1;
  // A cook to create for the portion, which is a share of it: set the
  // portion's cook with its servings, and no cook_id.
  NewCook new_cook = 2;
}

// A cook created with a portion of it.
message NewCook {
  // The ID of the household's recipe to cook. Required.
  string recipe_id = 1;
  // How many servings to cook, at least the portion's; the rest are left
  // over, to plan later. 0 for the portion's.
  double servings = 2;
}

message CreatePortionResponse {
  // The created portion.
  Portion portion = 1;
  // The cook created with it, if new_cook was set.
  Cook cook = 2;
}

message UpdatePortionRequest {
  // The portion, with its ID and the new values of the fields in
  // update_mask.
  Portion portion = 1;
  // The fields to update, e.g. "date,eating_time_id" or "cook.servings". If
  // empty, all fields are replaced. Switch between a cook and a food by
  // updating "cook" or "food" as a whole.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePortionResponse {
  // The updated portion.
  Portion portion = 1;
}

message DeletePortionRequest {
  // The ID of the portion.
  string id = 1;
}

message DeletePortionResponse {}

message CreateStapleRequest {
  // The staple.
  Staple staple = 1;
}

message CreateStapleResponse {
  // The created staple.
  Staple staple = 1;
}

message ListStaplesRequest {
  // Only list the staples of this person. Empty for everyone's.
  string person_id = 1;
}

message ListStaplesResponse {
  // The staples, ordered by person name and eating time.
  repeated Staple staples = 1;
}

message UpdateStapleRequest {
  // The staple, with its ID and the new values of the fields in
  // update_mask.
  Staple staple = 1;
  // The fields to update, e.g. "weekdays" or "food.amount". If empty,
  // all fields are replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateStapleResponse {
  // The updated staple.
  Staple staple = 1;
}

message DeleteStapleRequest {
  // The ID of the staple.
  string id = 1;
}

message DeleteStapleResponse {}

message SkipStapleRequest {
  // The ID of the staple.
  string id = 1;
  // The date to skip (YYYY-MM-DD).
  string date = 2;
}

message SkipStapleResponse {
  // The staple.
  Staple staple = 1;
}

message UnskipStapleRequest {
  // The ID of the staple.
  string id = 1;
  // The date to stop skipping (YYYY-MM-DD).
  string date = 2;
}

message UnskipStapleResponse {
  // The staple.
  Staple staple = 1;
}

message SetStapleEatenRequest {
  // The ID of the staple.
  string id = 1;
  // The date it's eaten on (YYYY-MM-DD), one of the staple's.
  string date = 2;
  // Whether it was eaten: true to take its food out of the pantry, false
  // to put it back.
  bool eaten = 3;
}

message SetStapleEatenResponse {
  // The staple. GetWeek shows the dates it was marked eaten on, with
  // PlannedPortion.eaten.
  Staple staple = 1;
  // What marking it eaten took out of the pantry, or un-marking it put
  // back. Empty if nothing changed, or nothing was in stock.
  repeated PantryChange pantry_changes = 2;
  // Whether pantry_changes were put back, rather than taken out.
  bool pantry_restored = 3;
}

message ListFrozenLeftoversRequest {}

message ListFrozenLeftoversResponse {
  // The frozen leftovers, by the date they were cooked.
  repeated FrozenLeftover leftovers = 1;
}

// Frozen servings of a cook, not all planned yet.
message FrozenLeftover {
  // The cook.
  Cook cook = 1;
  // How many of its frozen servings aren't planned yet, nor taken off
  // plan: those in the freezer.
  double remaining_servings = 2;
  // How many of its frozen servings are planned already, as portions eaten
  // after the recipe's fridge days.
  double planned_servings = 3;
  // The last date (YYYY-MM-DD) they keep frozen: the cook's date plus the
  // recipe's freezer_days. Empty if unknown.
  string keeps_until = 4;
  // Whether keeps_until is before today, so they should be thrown out:
  // take remaining_servings off plan with TakeFromFreezer.
  bool expired = 5;
  // The first date (YYYY-MM-DD) a portion of them is from the freezer: the
  // day after the recipe's fridge days. Empty if the recipe's fridge days
  // are unknown.
  string frozen_from = 6;
}

message TakeFromFreezerRequest {
  // The ID of the cook whose frozen leftovers to take, from
  // ListFrozenLeftovers. Required.
  string cook_id = 1;
  // How many servings to take, more than 0, at most those in the freezer.
  double servings = 2;
  // For a portion, the person eating them, with eating_time_id and date.
  // Empty to take them off plan.
  string person_id = 3;
  // The person's eating time, with person_id.
  string eating_time_id = 4;
  // The date they're eaten on (YYYY-MM-DD), on or after the cook's, with
  // person_id.
  string date = 5;
}

message TakeFromFreezerResponse {
  // What's left of the cook's frozen leftovers.
  FrozenLeftover leftover = 1;
  // The portion created, for a person.
  Portion portion = 2;
}

message SetCookSupplierRequest {
  // The ID of the cook using the component. Required.
  string cook_id = 1;
  // The ID of the component's recipe, one of the cook's recipe's
  // components. Required.
  string component_recipe_id = 2;
  // The ID of the cook to supply it, a cook of the component's recipe.
  // Required.
  string supplier_cook_id = 3;
}

message SetCookSupplierResponse {
  // The cook using the component, with its supplies.
  Cook cook = 1;
}

message SetEatingOutRequest {
  // The date (YYYY-MM-DD). Required.
  string date = 1;
  // The shared meal eaten out, for everyone who eats it, or person_ids.
  // Leave it unset to mark one person's eating time with person_id and
  // eating_time_id instead.
  people.v1.HouseholdMeal meal = 2;
  // The people who eat the shared meal out, of those who eat it; empty
  // for everyone who does.
  repeated string person_ids = 3;
  // The person, with eating_time_id, to mark one eating time of, when meal
  // is unset.
  string person_id = 4;
  // The eating time of person_id, when meal is unset.
  string eating_time_id = 5;
  // Whether they eat out: false to stop marking it, to plan it again.
  bool eating_out = 6;
  // Where, or anything else to remember, e.g. "Sam's birthday".
  string notes = 7;
}

message SetEatingOutResponse {}
