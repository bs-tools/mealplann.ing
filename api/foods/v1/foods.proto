syntax = "proto3";

package foods.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// FoodService manages the household's foods: the ingredients its recipes are
// made of, such as chickpeas, a brand of tofu or soy milk, with their
// nutrients per 100 g. Recipes (see RecipeService), meal plans (see
// PlanService), the pantry (see PantryService) and the shopping list (see
// ShoppingService) refer to these foods, and all nutrition is computed from them, so keep one food per
// ingredient and reuse it.
//
// To add an ingredient:
//
// 1. Look for it among the household's foods with ListFoods, and reuse it if
//    it's there.
// 2. Otherwise, search the reference foods with SearchFoodData, and create
//    the food from the best match with CreateFood, its source and its
//    source_id. Its nutrients are copied from the reference food. Prefer
//    generic reference foods for ingredients like vegetables, legumes and
//    grains.
// 3. Only for branded products the reference foods don't have, like a
//    particular tofu or plant milk, create a custom food with the nutrients
//    from its label, converted to per 100 g.
//
// The reference foods come from two sources, searched together:
//
// - The Canadian Nutrient File (CNF, source FOOD_SOURCE_CNF), Health
//   Canada's food composition database. Its foods are as sold in Canada,
//   including Canadian fortification, like the vitamin D and B12 added to
//   plant beverages and margarine, and Canadian products. For a household in
//   Canada, prefer a CNF match when it fits as well as an FDC one.
// - USDA FoodData Central (FDC, source FOOD_SOURCE_FDC), the US database,
//   which has more foods, and more recently analyzed ones in its Foundation
//   Foods dataset. Its fortified foods are as sold in the US.
//
// Then check that the food can be weighed: recipes measured in pieces need
// grams_per_piece, and recipes measured in milliliters need
// grams_per_milliliter. The pantry and the shopping list also use
// store_section, package_grams, shelf_life_days, preferred_store_id and
// always_in_stock: set them when you know them.
//
// People read recipes' amounts in each food's measure, in their own unit
// system: set measure to MEASURE_VOLUME for foods spooned or poured, like
// oils, vinegars, sauces, spices, dried herbs, baking powder and plant
// milks, with grams_per_milliliter, so 30 g of oil shows as 2 tbsp; to
// MEASURE_PIECES for foods counted, with grams_per_piece; and to
// MEASURE_WEIGHT for foods weighed. MEASURE_MILLILITERS keeps a liquid in
// milliliters for users of US units too, like a 400 ml can of coconut milk.
// Left unspecified, small amounts show by volume where grams_per_milliliter
// converts them, and otherwise in grams: find those foods with ListFoods'
// needs_measure.
//
// Meals' and plans' costs are estimated from each food's
// price_cents_per_kilogram: what the household pays at its stores, in
// Squamish, BC, in Canadian cents per kilogram, with the price_date it was
// seen. To price foods:
//
// 1. Use the shelf price of the size the household buys, from its stores' sites or flyers (like Save-On-Foods and Nesters Market in Squamish), or from what the user says they paid.
// 2. Convert it to cents per kilogram: a 900 g bag at $3.49 is 388; a 1 L carton at $4.29 of a food with grams_per_milliliter 1.03 is 417; produce priced each, at $1.29 an avocado of 170 g, is 759.
// 3. Set price_date to when the price was seen, and say so to the user when a price is an estimate.
//
// Use UpdateFood with the update_mask "price_cents_per_kilogram,price_date".
service FoodService {
  // Search the reference foods of the Canadian Nutrient File and USDA
  // FoodData Central (its Foundation Foods and SR Legacy datasets), without
  // meat, fish, dairy and eggs, by their English description, e.g.
  // "chickpeas cooked" or "spinach raw". Returns the best matches of both
  // sources first, with their source, nutrients per 100 g and common
  // portions. Both sources often have the same food under the same name:
  // see FoodService for which to prefer. Use it to pick the source and
  // source_id to create a food with CreateFood.
  rpc SearchFoodData(SearchFoodDataRequest) returns (SearchFoodDataResponse);
  // Create a food in the household, either from a reference food of the
  // Canadian Nutrient File or FoodData Central, copying its nutrients, or as
  // a custom food with the given nutrients. Fails with ALREADY_EXISTS if the
  // household has a food with the same name, which should then be reused
  // instead, and with INVALID_ARGUMENT if the reference food doesn't exist.
  rpc CreateFood(CreateFoodRequest) returns (CreateFoodResponse);
  // Create several foods at once, like the foods of a shelf or a receipt.
  // Each is created on its own, like CreateFood, in parallel: the response
  // has a result per request, in order, with what was created or the error.
  // At most 100 requests.
  rpc CreateFoods(CreateFoodsRequest) returns (CreateFoodsResponse);
  // Get one of the household's foods, by its ID or its name. Fails with
  // NOT_FOUND naming the foods with similar names if no food has the name.
  rpc GetFood(GetFoodRequest) returns (GetFoodResponse);
  // List the household's foods, optionally only those whose name contains a
  // text, ordered by name.
  rpc ListFoods(ListFoodsRequest) returns (ListFoodsResponse);
  // Update one of the household's foods. Recipes using it see the change
  // right away, as their nutrition is computed from their foods. Fails with
  // INVALID_ARGUMENT if preferred_store_id isn't one of the household's
  // stores.
  rpc UpdateFood(UpdateFoodRequest) returns (UpdateFoodResponse);
  // List what uses one of the household's foods: the recipes with it as an
  // ingredient, how many portions and staples of the plan eat it, and its
  // stock in the pantry. Use it to find the recipes to change when
  // replacing a food, or to check a food is unused before DeleteFood.
  rpc ListFoodUsages(ListFoodUsagesRequest) returns (ListFoodUsagesResponse);
  // Delete one of the household's foods. Fails with FAILED_PRECONDITION,
  // naming the recipes, if recipes use it: remove it from them first. Also
  // fails with FAILED_PRECONDITION if portions or staples of the plan (see
  // PlanService) eat it: delete them first. Its stock in the pantry is
  // deleted, and shopping list items of it are kept by name.
  rpc DeleteFood(DeleteFoodRequest) returns (DeleteFoodResponse);
}

// Nutrients are the amounts of the nutrients the app tracks in an amount of
// food, e.g. per 100 g of a food or per serving of a recipe. Every field is
// optional: unset means unknown, which is different from 0. The reference
// foods often lack iodine, vitamin B12 and vitamin D, for example. Only set
// the values you know, from a reference food or a food's label, and never
// guess them.
message Nutrients {
  // Energy, in kilocalories (kcal).
  optional double energy_kcal = 1;
  // Protein, in grams.
  optional double protein_grams = 2;
  // Total carbohydrate, in grams, including sugars and fiber, as the
  // reference foods and US and Canadian labels give it. European labels
  // give carbohydrate without fiber: add the label's fiber to it.
  optional double carbohydrate_grams = 3;
  // Total sugars, in grams. Part of carbohydrate_grams.
  optional double sugars_grams = 4;
  // Total fat, in grams.
  optional double fat_grams = 5;
  // Dietary fiber, in grams.
  optional double fiber_grams = 6;
  // Vitamin B12 (cobalamin), in micrograms.
  optional double vitamin_b12_micrograms = 7;
  // Iron, in milligrams.
  optional double iron_milligrams = 8;
  // Calcium, in milligrams.
  optional double calcium_milligrams = 9;
  // Vitamin D (D2 and D3), in micrograms. 1 µg is 40 IU.
  optional double vitamin_d_micrograms = 10;
  // Iodine, in micrograms.
  optional double iodine_micrograms = 11;
  // Zinc, in milligrams.
  optional double zinc_milligrams = 12;
  // Alpha-linolenic acid (ALA), the plant omega-3 fatty acid, in grams.
  optional double omega3_ala_grams = 13;
  // Folate, in micrograms of dietary folate equivalents (DFE).
  optional double folate_micrograms = 14;
  // Vitamin A, in micrograms of retinol activity equivalents (RAE).
  optional double vitamin_a_micrograms = 15;
  // Vitamin E (alpha-tocopherol), in milligrams.
  optional double vitamin_e_milligrams = 16;
  // Vitamin K (phylloquinone, K1), in micrograms.
  optional double vitamin_k_micrograms = 17;
  // Copper, in milligrams.
  optional double copper_milligrams = 18;
  // Magnesium, in milligrams.
  optional double magnesium_milligrams = 19;
  // Sodium, in milligrams. Labels often give salt instead: sodium is salt
  // divided by 2.5.
  optional double sodium_milligrams = 20;
  // Potassium, in milligrams.
  optional double potassium_milligrams = 21;
}

// Nutrient names a nutrient the app tracks: one value per field of
// Nutrients, in the same order, in the same unit. People's daily targets
// (see PersonService) and plan warnings (see PlanService) use it.
enum Nutrient {
  NUTRIENT_UNSPECIFIED = 0;
  // Energy, in kilocalories (kcal).
  NUTRIENT_ENERGY_KCAL = 1;
  // Protein, in grams.
  NUTRIENT_PROTEIN_GRAMS = 2;
  // Total carbohydrate, in grams, including sugars and fiber.
  NUTRIENT_CARBOHYDRATE_GRAMS = 3;
  // Total sugars, in grams.
  NUTRIENT_SUGARS_GRAMS = 4;
  // Total fat, in grams.
  NUTRIENT_FAT_GRAMS = 5;
  // Dietary fiber, in grams.
  NUTRIENT_FIBER_GRAMS = 6;
  // Vitamin B12, in micrograms.
  NUTRIENT_VITAMIN_B12_MICROGRAMS = 7;
  // Iron, in milligrams.
  NUTRIENT_IRON_MILLIGRAMS = 8;
  // Calcium, in milligrams.
  NUTRIENT_CALCIUM_MILLIGRAMS = 9;
  // Vitamin D, in micrograms.
  NUTRIENT_VITAMIN_D_MICROGRAMS = 10;
  // Iodine, in micrograms.
  NUTRIENT_IODINE_MICROGRAMS = 11;
  // Zinc, in milligrams.
  NUTRIENT_ZINC_MILLIGRAMS = 12;
  // Alpha-linolenic acid (ALA), the plant omega-3, in grams.
  NUTRIENT_OMEGA3_ALA_GRAMS = 13;
  // Folate, in micrograms of dietary folate equivalents.
  NUTRIENT_FOLATE_MICROGRAMS = 14;
  // Vitamin A, in micrograms of retinol activity equivalents.
  NUTRIENT_VITAMIN_A_MICROGRAMS = 15;
  // Vitamin E, in milligrams.
  NUTRIENT_VITAMIN_E_MILLIGRAMS = 16;
  // Vitamin K, in micrograms.
  NUTRIENT_VITAMIN_K_MICROGRAMS = 17;
  // Copper, in milligrams.
  NUTRIENT_COPPER_MILLIGRAMS = 18;
  // Magnesium, in milligrams.
  NUTRIENT_MAGNESIUM_MILLIGRAMS = 19;
  // Sodium, in milligrams.
  NUTRIENT_SODIUM_MILLIGRAMS = 20;
  // Potassium, in milligrams.
  NUTRIENT_POTASSIUM_MILLIGRAMS = 21;
}

// FoodSource is where a food's nutrients come from.
enum FoodSource {
  FOOD_SOURCE_UNSPECIFIED = 0;
  // USDA FoodData Central, the US food composition database. Its IDs are
  // FDC IDs, e.g. 173756.
  FOOD_SOURCE_FDC = 1;
  // Entered by hand or by an agent, e.g. from a product's label. Only for
  // the household's foods.
  FOOD_SOURCE_CUSTOM = 2;
  // Health Canada's Canadian Nutrient File, Canada's food composition
  // database. Its IDs are CNF food IDs, e.g. 3183.
  FOOD_SOURCE_CNF = 3;
}

// StoreSection is the part of a store a food is found in, which groups the
// shopping list.
enum StoreSection {
  // Not set.
  STORE_SECTION_UNSPECIFIED = 0;
  // Fresh fruit, vegetables and herbs.
  STORE_SECTION_PRODUCE = 1;
  // Bread and baked goods.
  STORE_SECTION_BAKERY = 2;
  // Refrigerated foods, like tofu, tempeh and plant yogurts.
  STORE_SECTION_CHILLED = 3;
  // Frozen foods.
  STORE_SECTION_FROZEN = 4;
  // Dry goods, like pasta, rice, flour, dried legumes, nuts and seeds.
  STORE_SECTION_DRY_GOODS = 5;
  // Canned and jarred foods.
  STORE_SECTION_CANNED = 6;
  // Spices, dried herbs and seasonings.
  STORE_SECTION_SPICES = 7;
  // Drinks, including plant milks sold unrefrigerated.
  STORE_SECTION_DRINKS = 8;
  // Household goods that aren't food.
  STORE_SECTION_HOUSEHOLD = 9;
  // Anything else.
  STORE_SECTION_OTHER = 10;
}

// AmountUnit is the unit of an amount of a food, e.g. of a recipe's
// ingredient. Amounts are converted to grams with the food's
// grams_per_piece and grams_per_milliliter.
enum AmountUnit {
  AMOUNT_UNIT_UNSPECIFIED = 0;
  // Grams. Use the unit the recipe gives, like grams or tablespoons.
  AMOUNT_UNIT_GRAMS = 1;
  // Milliliters, for liquids, e.g. 250 ml of soy milk.
  AMOUNT_UNIT_MILLILITERS = 2;
  // Pieces, e.g. 2 onions or 3 cloves of garlic.
  AMOUNT_UNIT_PIECES = 3;
  // The kitchen units below are converted to milliliters or grams, and a
  // recipe's ingredients keep the one they're entered in, to show them as
  // written, like 1 tablespoon of oil rather than 15 ml. Elsewhere they're
  // returned converted.
  //
  // Teaspoons, of 5 ml.
  AMOUNT_UNIT_TEASPOONS = 4;
  // Tablespoons, of 15 ml.
  AMOUNT_UNIT_TABLESPOONS = 5;
  // US cups, of 240 ml.
  AMOUNT_UNIT_CUPS = 6;
  // Liters, of 1000 ml.
  AMOUNT_UNIT_LITERS = 7;
  // Kilograms, of 1000 g.
  AMOUNT_UNIT_KILOGRAMS = 8;
  // Ounces by weight, of 28.35 g.
  AMOUNT_UNIT_OUNCES = 9;
  // Pounds, of 453.6 g.
  AMOUNT_UNIT_POUNDS = 10;
}

// A food: an ingredient, such as chickpeas, a brand of tofu or soy milk.
message Food {
  // The ID of the food. Required to update it, and ignored when creating
  // it.
  string id = 1;
  // The name of the food, as the household calls it, e.g. "Chickpeas,
  // canned" or "Tofu, firm". From 1 to 200 characters, and unique in the
  // household, ignoring case.
  string name = 2;
  // Where the food's nutrients come from: the source of the reference food
  // it was created from, or FOOD_SOURCE_CUSTOM.
  FoodSource source = 3 [(mcp.v1.field).output_only = true];
  // The ID of the FoodData Central food it was created from, 0 for foods
  // from other sources and custom foods. The same as source_id for foods
  // from FDC; prefer source and source_id.
  int32 fdc_id = 4 [(mcp.v1.field).output_only = true];
  // The nutrients in 100 g of the food. Unset nutrients are unknown. For
  // custom foods, enter the values from the label's "per 100 g" column;
  // convert values given per serving or per 100 ml to per 100 g first.
  Nutrients nutrients = 5;
  // The typical weight of one piece in grams, e.g. 150 for an onion or 5 for
  // a clove of garlic, so amounts in pieces can be weighed. 0 if unknown or
  // the food doesn't come in pieces.
  double grams_per_piece = 6;
  // The density in grams per milliliter, e.g. 1.03 for soy milk or 0.92 for
  // oil, so amounts in milliliters can be weighed. 0 if unknown.
  double grams_per_milliliter = 7;
  // Whether the food's carbohydrate is quickly absorbed, like white bread,
  // white rice, fruit juice, sugar, syrups and dried fruit, which matters for
  // reactive hypoglycemia. Only set it for foods that are; FDC has no
  // glycemic index, so it's never set automatically. False by default.
  bool fast_carb = 8;
  // The part of the store the food is found in, for the shopping list.
  // STORE_SECTION_UNSPECIFIED if not set.
  StoreSection store_section = 9;
  // The typical size of a pack as sold, in grams, e.g. 400 for a can of
  // chickpeas, to round shopping quantities up to whole packs. 0 if unknown
  // or sold loose.
  double package_grams = 10;
  // How many days the food keeps once bought, unopened, e.g. 5 for fresh
  // spinach or 365 for dried lentils. 0 if unknown.
  int32 shelf_life_days = 11;
  // How many days the food keeps once opened, e.g. 4 for an opened carton of
  // soy milk. 0 if unknown or the same as shelf_life_days.
  int32 opened_shelf_life_days = 12;
  // How many days the food keeps frozen, from the day it's frozen, e.g. 90
  // for bread or 180 for cooked beans. A pantry lot in the freezer is used
  // by then, however soon its pack expires. 0 if unknown.
  int32 freezer_shelf_life_days = 19;
  // What the household pays for it, in Canadian cents per kilogram, at
  // the stores it shops at (for this household, in Squamish, BC), e.g. 499
  // for $4.99/kg, or 388 for a 900 g bag at $3.49. Meals' and plans' costs
  // are estimated from it (see RecipeService and PlanService.GetPlanCost).
  // 0 if unknown. At most 1000000 ($10,000/kg).
  int32 price_cents_per_kilogram = 20;
  // When the price was seen (YYYY-MM-DD), to know how current it is. Empty
  // if unknown. Setting a price through the web app sets it to the day.
  string price_date = 21;
  // Notes about the food, e.g. the brand or where to buy it. At most 2000
  // characters.
  string notes = 13;
  // When the food was created.
  google.protobuf.Timestamp create_time = 14 [(mcp.v1.field).output_only = true];
  // When the food was last changed.
  google.protobuf.Timestamp update_time = 15 [(mcp.v1.field).output_only = true];
  // The ID of the household's store the food is always bought at, e.g. a
  // bulk store for nuts or an Asian grocery for tofu, see
  // ShoppingService.ListStores. Empty for the main store, the first one,
  // where the shopping list puts everything else. Deleting the store
  // empties it.
  string preferred_store_id = 16;
  // Whether the household always has the food, like salt, pepper, dried
  // spices or oil, so the pantry doesn't track it by weight and the
  // shopping list leaves it out. Cooks marked done don't take it out of the
  // pantry. Add it to a shopping list by hand when it runs out. False by
  // default.
  bool always_in_stock = 17;
  // The ID of the reference food it was created from in its source, e.g.
  // a CNF food ID for FOOD_SOURCE_CNF. 0 for custom foods.
  int32 source_id = 18 [(mcp.v1.field).output_only = true];
  // How the food's amounts are shown to people in recipes, in their unit
  // system (see users.v1.User.unit_system), whatever unit they're entered
  // in: e.g. MEASURE_VOLUME for oils, vinegars, spices and plant milks,
  // shown in teaspoons, tablespoons, cups or milliliters, and
  // MEASURE_WEIGHT for tofu, pasta or flour. Converting between weight and
  // volume needs grams_per_milliliter, and to pieces grams_per_piece.
  Measure measure = 22;
}

// Measure is how a food's amounts are shown to people.
enum Measure {
  // Chosen by the amount: up to 75 ml, by volume if grams_per_milliliter
  // converts it, like a tablespoon of oil or a teaspoon of cumin, and
  // otherwise in the unit it's entered in.
  MEASURE_UNSPECIFIED = 0;
  // By weight, in grams or ounces.
  MEASURE_WEIGHT = 1;
  // By volume, in spoons, cups or milliliters.
  MEASURE_VOLUME = 2;
  // In pieces, like 2 onions.
  MEASURE_PIECES = 3;
  // By volume in milliliters, with spoons for small amounts, whatever the
  // user's unit system: for liquids sold by the milliliter, like a 400 ml
  // can of coconut milk, which cups would only approximate.
  MEASURE_MILLILITERS = 4;
}

// A reference food, of the Canadian Nutrient File or USDA FoodData Central.
message FoodData {
  // The FDC ID of the food for foods of FoodData Central, 0 for foods of
  // other sources. The same as source_id; prefer source and source_id.
  int32 fdc_id = 1;
  // The description in its source, e.g. "Chickpeas (garbanzo beans, bengal
  // gram), mature seeds, cooked, boiled, without salt".
  string description = 2;
  // The source's food category or group, e.g. "Legumes and Legume
  // Products".
  string category = 3;
  // The dataset: for FDC, "foundation_food" for Foundation Foods, which are
  // analyzed recently, or "sr_legacy_food" for SR Legacy, which has more
  // foods and nutrients; "cnf" for the Canadian Nutrient File.
  string data_type = 4;
  // The nutrients in 100 g of the food. Unset nutrients are unknown.
  Nutrients nutrients = 5;
  // Common portions of the food with their weight, e.g. "1 cup" or "1
  // medium".
  repeated FoodDataPortion portions = 6;
  // The ID of the household's food created from this reference food, empty
  // if none. Reuse that food rather than creating another.
  string food_id = 7;
  // The source of the food: FOOD_SOURCE_CNF or FOOD_SOURCE_FDC.
  FoodSource source = 8;
  // The ID of the food in its source, to create a food from with
  // CreateFood, with source.
  int32 source_id = 9;
  // The French description, for foods of the Canadian Nutrient File, e.g.
  // "Pois chiches, en conserve". Empty for FDC.
  string french_description = 10;
}

// A common portion of a reference food.
message FoodDataPortion {
  // The portion, e.g. "1 cup, chopped", "1 medium (2-1/2\" dia)" or
  // "250ml".
  string description = 1;
  // The weight of the portion, in grams.
  double grams = 2;
}

message SearchFoodDataRequest {
  // The words to search for in the English descriptions, e.g. "lentils red
  // raw". Required.
  string query = 1;
  // The most foods to return, from 1 to 50. 10 if 0.
  int32 page_size = 2;
}

message SearchFoodDataResponse {
  // The matching foods of both sources, the best match first.
  repeated FoodData foods = 1;
}

message CreateFoodRequest {
  // The FoodData Central food to create the food from. The same as source
  // FOOD_SOURCE_FDC with source_id; prefer those. 0 if not set.
  int32 fdc_id = 1;
  // The food. For a custom food, name is required. From a reference food,
  // all fields are optional, and override what's taken from it: prefer a
  // short name, like "Chickpeas, cooked", to the long description.
  Food food = 2;
  // The source of the reference food to create the food from, found with
  // SearchFoodData: FOOD_SOURCE_CNF or FOOD_SOURCE_FDC, with source_id. Its
  // nutrients are copied, so leave food.nutrients unset. Its description is
  // the name unless food.name is set, and its portions suggest
  // grams_per_piece and grams_per_milliliter unless they're set.
  // FOOD_SOURCE_UNSPECIFIED, with neither source_id nor fdc_id, for a
  // custom food.
  FoodSource source = 3;
  // The ID of the reference food in source, the source_id of
  // SearchFoodData's result. Required with source.
  int32 source_id = 4;
  // An ID the caller chooses for this request, like a UUID, to retry it
  // safely: a retry with the same request_id within a day returns the
  // first response instead of creating again. Empty to not deduplicate. At
  // most 100 characters.
  string request_id = 5;
}

message CreateFoodResponse {
  // The created food.
  Food food = 1;
}

message CreateFoodsRequest {
  // The foods to create, each as CreateFood takes it, without a
  // request_id. At most 100.
  repeated CreateFoodRequest requests = 1;
  // An ID the caller chooses for this request, like a UUID, to retry it
  // safely: a retry with the same request_id within a day returns the
  // first response instead of creating again. Empty to not deduplicate. At
  // most 100 characters.
  string request_id = 2;
}

message CreateFoodsResponse {
  // A result per request, in order.
  repeated CreateFoodResult results = 1;
}

// The result of creating one of several foods.
message CreateFoodResult {
  // The created food, unset if it failed.
  Food food = 1;
  // The code of the error, like "invalid_argument" or "already_exists",
  // empty if the food was created.
  string error_code = 2;
  // What went wrong and what to do, empty if the food was created.
  string error_message = 3;
}

message GetFoodRequest {
  // The ID of the food. Required, unless name is set.
  string id = 1;
  // The name of the food, ignoring case, instead of its ID, e.g. "Black
  // beans, cooked from dry".
  string name = 2;
}

message GetFoodResponse {
  // The food.
  Food food = 1;
}

message ListFoodsRequest {
  // Only list foods whose name contains this text, ignoring case. Empty to
  // list all.
  string query = 1;
  // The most foods to return, from 1 to 200. 25 if 0.
  int32 page_size = 2;
  // The next_page_token of the previous page, to get the next one. Empty for
  // the first page.
  string page_token = 3;
  // Whether to return only each food's ID, name, and how it's weighed,
  // measured and stocked (grams_per_piece, grams_per_milliliter, measure,
  // package_grams, store_section, preferred_store_id, always_in_stock),
  // leaving out its nutrients, prices, notes and times, and any fields at
  // their default values, to look foods up cheaply. Get a food's details
  // with GetFood.
  bool summary = 4;
  // Only list foods with no measure and no grams_per_milliliter, which
  // recipes always show in grams: set a measure, with a density for
  // volume, where grams read oddly, like spices, oils, butter or fresh
  // herbs.
  bool needs_measure = 5;
}

message ListFoodsResponse {
  // The foods, ordered by name.
  repeated Food foods = 1;
  // The token to get the next page with, empty if this is the last page.
  string next_page_token = 2;
}

message UpdateFoodRequest {
  // The food, with its ID and the new values of the fields in update_mask.
  Food food = 1;
  // The fields to update, e.g. "name,grams_per_piece". If empty, all fields
  // are replaced. Nutrients can be updated one at a time, e.g.
  // "nutrients.iodine_micrograms"; leaving a nutrient unset in
  // food then clears it to unknown.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateFoodResponse {
  // The updated food.
  Food food = 1;
}

message ListFoodUsagesRequest {
  // The ID of the household's food.
  string food_id = 1;
}

message ListFoodUsagesResponse {
  // The recipes with the food as an ingredient, by name. Recipes using it
  // only through a component recipe aren't listed: the component is.
  repeated FoodUsageRecipe recipes = 1;
  // How many portions of the plan eat the food without a recipe.
  int32 portion_count = 2;
  // How many staples of the plan eat the food.
  int32 staple_count = 3;
  // How many lots of the food the pantry has.
  int32 pantry_lot_count = 4;
  // The grams of the food in the pantry, in all its lots.
  double pantry_grams = 5;
}

// A recipe using a food.
message FoodUsageRecipe {
  // The ID of the recipe.
  string id = 1;
  // The name of the recipe.
  string name = 2;
}

message DeleteFoodRequest {
  // The ID of the food.
  string id = 1;
}

message DeleteFoodResponse {}
